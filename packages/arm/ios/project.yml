name: Kraki
options:
  bundleIdPrefix: chat.kraki.ios
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: false
  createIntermediateGroups: true

packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift.git
    revision: 36e30a6f1ef10e4194f6af0cff90888526f0c115
  Highlightr:
    url: https://github.com/raspu/Highlightr.git
    exactVersion: 2.3.0
  Pulse:
    path: ./Vendor/Pulse
  VoiceInputCore:
    path: ./Vendor/VoiceInputCore
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle.git
    exactVersion: 2.9.5

settings:
  base:
    SWIFT_VERSION: "5.9"

schemes:
  Kraki:
    build:
      targets:
        Kraki: all
        KrakiTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - KrakiTests
  KrakiMac:
    build:
      targets:
        KrakiMac: all
    run:
      config: Debug

targets:
  Kraki:
    type: application
    platform: iOS
    sources:
      - path: Kraki
        excludes:
          - "**/.DS_Store"
    resources:
      - path: Kraki/Resources/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: chat.kraki.ios
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: true
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSCameraUsageDescription: "Kraki uses the camera to scan QR codes for device pairing."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Kraki uses the microphone for press-to-talk voice messages."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Kraki transcribes your voice on-device so you can dictate messages."
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: false
        INFOPLIST_KEY_UIBackgroundModes: ["remote-notification"]
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 3A83X5JZ3S
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: Kraki/Kraki.entitlements
        Release:
          CODE_SIGN_ENTITLEMENTS: Kraki/Kraki.Release.entitlements
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: Kraki App Store CI
    dependencies:
      - target: KrakiNotification
        embed: true
      - package: GRDB
      - package: Highlightr
      - package: Pulse
      - package: VoiceInputCore

  KrakiNotification:
    type: app-extension
    platform: iOS
    sources:
      - path: KrakiNotification
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: chat.kraki.ios.notification
        INFOPLIST_FILE: KrakiNotification/Info.plist
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: 1
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 3A83X5JZ3S
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_ENTITLEMENTS: KrakiNotification/KrakiNotification.entitlements
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: Kraki Notification App Store CI

  KrakiTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: KrakiTests
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: chat.kraki.ios.tests
        GENERATE_INFOPLIST_FILE: true
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Kraki.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Kraki"
        BUNDLE_LOADER: "$(TEST_HOST)"
    dependencies:
      - target: Kraki

  KrakiMac:
    type: application
    platform: macOS
    sources:
      # Core layer — cross-platform after the M0 platformization pass.
      - path: Kraki/Core
      # Shared platform shims (KrakiPlatform exposes PlatformColor + helpers;
      # ThemePlatform is the macOS palette; Theme.swift stays iOS-only).
      - path: Kraki/Shared/KrakiPlatform.swift
      - path: Kraki/Shared/ThemePlatform.swift
      - path: Kraki/Shared/AppColorScheme.swift
      - path: Kraki/Shared/AgentAvatar.swift
      - path: Kraki/Shared/Helpers.swift
      - path: Kraki/Shared/KrakiLogger.swift
      - path: Kraki/Shared/LucideIcon.swift
      - path: Kraki/Shared/NavigationIDs.swift
      - path: Kraki/Shared/ToolStatusIcon.swift
      # AppState is platformized (push + willTerminate guarded).
      - path: Kraki/App/AppState.swift
      # Mac-only app shell, scenes, commands.
      - path: Kraki/App/Mac
        excludes:
          - MacUpdateController.swift
      - path: Kraki/App/Mac/MacUpdateController.swift
      # Mac-only feature surfaces (sidebar, welcome, tentacle, preferences,
      # chat placeholder, pairing). Their iOS analogues stay iOS-only — the
      # macOS chat surface will be rewritten against the pure-spine model.
      - path: Kraki/Features/Sessions/SessionsSidebarView+macOS.swift
      - path: Kraki/Features/Sessions/NewSessionSheet+macOS.swift
      - path: Kraki/Features/Sessions/SessionCardView.swift
      - path: Kraki/Features/Sessions/ActivityRow.swift
      - path: Kraki/Features/Auth/ConnectionStatusChip.swift
      - path: Kraki/Features/Auth/LoginView+macOS.swift
      - path: Kraki/Features/Chat/ToolChipHeader.swift
      - path: Kraki/Features/Chat/ChatViewModel.swift
      - path: Kraki/Features/Chat/TurnSpineProjection.swift
      - path: Kraki/Features/Chat/ChatLoadingState.swift
      - path: Kraki/Features/Chat/Sizing/HeightMeasurementScheduler.swift
      - path: Kraki/Features/Chat/Mac
      - path: Kraki/Features/Welcome
      - path: Kraki/Features/Tentacle
      - path: Kraki/Features/Settings/MacPanes
      - path: Kraki/Features/Chat/ChatPlaceholderView+macOS.swift
      - path: Kraki/Features/Pairing/PairingSheet+macOS.swift
      # Asset catalog (iOS universal icon + macOS icon sizes).
      - path: Kraki/Resources/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: chat.kraki.mac
        PRODUCT_NAME: Kraki
        MARKETING_VERSION: "0.2.25"
        CURRENT_PROJECT_VERSION: 27
        GENERATE_INFOPLIST_FILE: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 3A83X5JZ3S
        # No App Sandbox — we need to spawn the kraki CLI binary
        # (Process.launch) and tail logs from ~/.kraki/logs. Hardened
        # runtime + Developer ID notarization is the security envelope
        # instead. This is the same model as iTerm / Docker Desktop.
        ENABLE_HARDENED_RUNTIME: "YES"
        CODE_SIGN_ENTITLEMENTS: Kraki/KrakiMac.entitlements
        SWIFT_OBJC_INTERFACE_HEADER_NAME: ""
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: chat.kraki.mac.dev
          PRODUCT_NAME: "Kraki Dev"
          INFOPLIST_FILE: KrakiMac.Debug.Info.plist
          INFOPLIST_KEY_CFBundleDisplayName: "Kraki (Dev)"
          ASSETCATALOG_COMPILER_APPICON_NAME: DevAppIcon
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: chat.kraki.mac
          PRODUCT_NAME: Kraki
          INFOPLIST_FILE: KrakiMac.Info.plist
          INFOPLIST_KEY_CFBundleDisplayName: Kraki
          ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: GRDB
      - package: Pulse
      - package: Highlightr
      - package: VoiceInputCore
      - package: Sparkle
