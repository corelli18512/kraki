name: Kraki
options:
  bundleIdPrefix: chat.kraki.ios
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: false
  createIntermediateGroups: true

packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift.git
    revision: 36e30a6f1ef10e4194f6af0cff90888526f0c115
  Highlightr:
    url: https://github.com/raspu/Highlightr.git
    exactVersion: 2.3.0
  Pulse:
    path: ./Vendor/Pulse
  VoiceInputCore:
    path: ./Vendor/VoiceInputCore
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle.git
    exactVersion: 2.9.5

configs:
  Debug: debug
  Release: release
  Diagnostics: release
  DiagnosticsDelivery: release

settings:
  base:
    SWIFT_VERSION: "5.9"
  configs:
    Diagnostics:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) KRAKI_DIAG"
    DiagnosticsDelivery:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) KRAKI_DIAG KRAKI_DIAG_EXISTING_IDENTITY"

schemes:
  KrakiDiag:
    build:
      targets:
        Kraki: all
    run:
      config: Diagnostics
    archive:
      config: Diagnostics
  KrakiMacDiag:
    build:
      targets:
        KrakiMac: all
    run:
      config: Diagnostics
    archive:
      config: Diagnostics
  Kraki:
    build:
      targets:
        Kraki: all
        KrakiTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - KrakiTests
      environmentVariables:
        KRAKI_TEST_ISOLATION: "1"
        KRAKI_RUN_PERF_TESTS: "$(KRAKI_RUN_PERF_TESTS)"
        KRAKI_RUN_UI_TESTS: "$(KRAKI_RUN_UI_TESTS)"
  KrakiUITests:
    build:
      targets:
        Kraki: all
        KrakiUITests: [test]
    test:
      config: Debug
      targets:
        - KrakiUITests
  KrakiVoiceHold:
    build:
      targets:
        Kraki: all
        KrakiVoiceUITests: [test]
    test:
      config: Debug
      targets:
        - KrakiVoiceUITests
  KrakiMac:
    build:
      targets:
        KrakiMac: all
    run:
      config: Debug
  KrakiMacTests:
    build:
      targets:
        KrakiMac: all
        KrakiMacTests: [test]
    test:
      config: Debug
      targets:
        - KrakiMacTests
      environmentVariables:
        # Empty isolated host; tests create their own offline windows/databases.
        KRAKI_TEST_ISOLATION: "1"
        KRAKI_RUN_PERF_TESTS: "$(KRAKI_RUN_PERF_TESTS)"
        KRAKI_RUN_UI_TESTS: "$(KRAKI_RUN_UI_TESTS)"
        KRAKI_DATA_DIR: /tmp/kraki-mac-tests-data

targets:
  Kraki:
    type: application
    platform: iOS
    sources:
      - path: Kraki
        excludes:
          - "**/.DS_Store"
          - "Resources/Mermaid/**"
      # Client-side Mermaid runtime for show_report (MIT; see LICENSE-mermaid.txt).
      - path: Kraki/Resources/Mermaid
        buildPhase: resources
    resources:
      - path: Kraki/Resources/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: chat.kraki.ios
        MARKETING_VERSION: "0.1.1"
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: true
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSCameraUsageDescription: "Kraki uses the camera to scan QR codes for device pairing."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Kraki uses the microphone for press-to-talk voice messages."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Kraki transcribes your voice on-device so you can dictate messages."
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: false
        INFOPLIST_KEY_UIBackgroundModes: ["remote-notification"]
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 3A83X5JZ3S
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # iPad support is deferred until it has a macOS-aligned layout.
        TARGETED_DEVICE_FAMILY: "1"
      configs:
        Diagnostics:
          PRODUCT_BUNDLE_IDENTIFIER: chat.kraki.ios.diag
          INFOPLIST_KEY_CFBundleDisplayName: "Kraki Diag"
          CODE_SIGN_ENTITLEMENTS: Kraki/Kraki.Diagnostics.entitlements
          ASSETCATALOG_COMPILER_APPICON_NAME: DevAppIcon
        DiagnosticsDelivery:
          CODE_SIGN_ENTITLEMENTS: Kraki/Kraki.Release.entitlements
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: Kraki App Store CI
        Debug:
          CODE_SIGN_ENTITLEMENTS: Kraki/Kraki.entitlements
        Release:
          CODE_SIGN_ENTITLEMENTS: Kraki/Kraki.Release.entitlements
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: Kraki App Store CI
    dependencies:
      - target: KrakiNotification
        embed: true
      - package: GRDB
      - package: Highlightr
      - package: Pulse
      - package: VoiceInputCore

  KrakiNotification:
    type: app-extension
    platform: iOS
    sources:
      - path: KrakiNotification
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: chat.kraki.ios.notification
        INFOPLIST_FILE: KrakiNotification/Info.plist
        MARKETING_VERSION: "0.1.1"
        CURRENT_PROJECT_VERSION: 1
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 3A83X5JZ3S
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_ENTITLEMENTS: KrakiNotification/KrakiNotification.entitlements
      configs:
        Diagnostics:
          PRODUCT_BUNDLE_IDENTIFIER: chat.kraki.ios.diag.notification
          CODE_SIGN_ENTITLEMENTS: KrakiNotification/KrakiNotification.Diagnostics.entitlements
        DiagnosticsDelivery:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: Kraki Notification App Store CI
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: Kraki Notification App Store CI

  KrakiTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: KrakiTests
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: chat.kraki.ios.tests
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: true
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Kraki.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Kraki"
        BUNDLE_LOADER: "$(TEST_HOST)"
    dependencies:
      - target: Kraki

  KrakiMacTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: KrakiMacTests
      - path: KrakiTests/NativeSessionPreviewGlyphTests.swift
      - path: KrakiTests/ForegroundTestGate.swift
      - path: KrakiTests/IOSVoiceComposerTests.swift
      - path: KrakiTests/AccountUsageTests.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: chat.kraki.mac.tests
        GENERATE_INFOPLIST_FILE: true
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Kraki Dev.app/Contents/MacOS/Kraki Dev"
        BUNDLE_LOADER: "$(TEST_HOST)"
    dependencies:
      - target: KrakiMac

  KrakiUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: KrakiUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: chat.kraki.ios.uitests
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: true
        TEST_TARGET_NAME: Kraki
    dependencies:
      - target: Kraki

  KrakiVoiceUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: KrakiVoiceUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: chat.kraki.ios.voice-uitests
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: true
        TEST_TARGET_NAME: Kraki
    dependencies:
      - target: Kraki

  KrakiMac:
    type: application
    platform: macOS
    sources:
      # Core layer — cross-platform after the M0 platformization pass.
      - path: Kraki/Core
      # Shared platform shims (KrakiPlatform exposes PlatformColor + helpers;
      # ThemePlatform is the macOS palette; Theme.swift stays iOS-only).
      - path: Kraki/Shared/KrakiPlatform.swift
      - path: Kraki/Shared/ThemePlatform.swift
      - path: Kraki/Shared/AppColorScheme.swift
      - path: Kraki/Shared/AgentAvatar.swift
      - path: Kraki/Shared/Helpers.swift
      - path: Kraki/Shared/KrakiLogger.swift
      - path: Kraki/Shared/EventMonitorForwarding.swift
      - path: Kraki/Shared/LucideIcon.swift
      - path: Kraki/Shared/NavigationIDs.swift
      - path: Kraki/Shared/ToolStatusIcon.swift
      - path: Kraki/Shared/PermissionDiffPreview.swift
      - path: Kraki/Shared/DiagnosticsSummary.swift
      # AppState is platformized (push + willTerminate guarded).
      - path: Kraki/App/AppState.swift
      # Mac-only app shell, scenes, commands.
      - path: Kraki/App/Mac
        excludes:
          - MacUpdateController.swift
      - path: Kraki/App/Mac/MacUpdateController.swift
      # Mac-only feature surfaces (sidebar, welcome, tentacle, preferences,
      # chat placeholder, pairing). Their iOS analogues stay iOS-only — the
      # macOS chat surface will be rewritten against the pure-spine model.
      - path: Kraki/Features/Sessions/SessionsSidebarView+macOS.swift
      - path: Kraki/Features/Sessions/ArchivedSessionsView.swift
      - path: Kraki/Features/Sessions/NewSessionSheet+macOS.swift
      - path: Kraki/Features/Sessions/NoAgentsGuide.swift
      - path: Kraki/Features/Sessions/SessionCardView.swift
      - path: Kraki/Features/Sessions/ActivityRow.swift
      - path: Kraki/Features/Auth/ConnectionStatusChip.swift
      - path: Kraki/Features/Auth/LoginView+macOS.swift
      - path: Kraki/Features/Auth/GitHubMark.swift
      - path: Kraki/Features/Auth/MacSetupIntro.swift
      - path: Kraki/Features/Chat/ToolChipHeader.swift
      - path: Kraki/Features/Chat/ChatViewModel.swift
      - path: Kraki/Features/Chat/TurnSpineProjection.swift
      - path: Kraki/Features/Chat/ChatLoadingState.swift
      - path: Kraki/Features/Chat/ChatScrollPolicy.swift
      - path: Kraki/Features/Chat/Sizing/HeightMeasurementScheduler.swift
      - path: Kraki/Features/Chat/Mac
      # DEBUG-only synthetic voice fixture shared with native Mac tests.
      - path: Kraki/Features/Diagnostics/IOSVoiceHoldScenario.swift
      - path: Kraki/Features/Welcome
      - path: Kraki/Features/Tentacle
      - path: Kraki/Features/Settings/MacPanes
      - path: Kraki/Features/Usage
      - path: Kraki/Features/Chat/ChatPlaceholderView+macOS.swift
      - path: Kraki/Features/Pairing/PairingSheet+macOS.swift
      - path: Kraki/Features/Pairing/PairingLink.swift
      # Asset catalog (iOS universal icon + macOS icon sizes).
      - path: Kraki/Resources/Assets.xcassets
      # Client-side Mermaid runtime for show_report (MIT; see LICENSE-mermaid.txt).
      - path: Kraki/Resources/Mermaid
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: chat.kraki.mac
        PRODUCT_NAME: Kraki
        MARKETING_VERSION: "0.2.58"
        CURRENT_PROJECT_VERSION: 60
        GENERATE_INFOPLIST_FILE: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 3A83X5JZ3S
        # No App Sandbox — we need to spawn the kraki CLI binary
        # (Process.launch) and tail logs from ~/.kraki/logs. Hardened
        # runtime + Developer ID notarization is the security envelope
        # instead. This is the same model as iTerm / Docker Desktop.
        ENABLE_HARDENED_RUNTIME: "YES"
        CODE_SIGN_ENTITLEMENTS: Kraki/KrakiMac.entitlements
        SWIFT_OBJC_INTERFACE_HEADER_NAME: ""
        # The embed phase writes into Contents/Library (see postBuildScripts).
        ENABLE_USER_SCRIPT_SANDBOXING: NO
      configs:
        Diagnostics:
          PRODUCT_BUNDLE_IDENTIFIER: chat.kraki.mac.diag
          PRODUCT_NAME: "Kraki Diag"
          INFOPLIST_FILE: KrakiMac.Diagnostics.Info.plist
          ASSETCATALOG_COMPILER_APPICON_NAME: DevAppIcon
        DiagnosticsDelivery:
          PRODUCT_BUNDLE_IDENTIFIER: chat.kraki.mac
          PRODUCT_NAME: Kraki
          INFOPLIST_FILE: KrakiMac.Info.plist
          INFOPLIST_KEY_CFBundleDisplayName: Kraki
          ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: chat.kraki.mac.dev
          PRODUCT_NAME: "Kraki Dev"
          INFOPLIST_FILE: KrakiMac.Debug.Info.plist
          INFOPLIST_KEY_CFBundleDisplayName: "Kraki (Dev)"
          ASSETCATALOG_COMPILER_APPICON_NAME: DevAppIcon
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: chat.kraki.mac
          PRODUCT_NAME: Kraki
          INFOPLIST_FILE: KrakiMac.Info.plist
          INFOPLIST_KEY_CFBundleDisplayName: Kraki
          ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    postBuildScripts:
      # Built-in tentacle: copies the prebuilt, signed helper "Kraki.app" into
      # Contents/Library/Helpers and writes its SMAppService launch agent.
      # Without a staged helper the app builds without it (external CLI mode);
      # release CI sets KRAKI_REQUIRE_TENTACLE=1. See scripts/mac/.
      - name: Embed built-in tentacle
        # Isolated test projects (scripts/test-native.sh) are generated outside
        # the repository, where this relative path does not exist; they build
        # without the helper (external CLI mode), like any build without one.
        script: |
          SCRIPT="$SRCROOT/../../../scripts/mac/embed-tentacle-helper.sh"
          if [ ! -f "$SCRIPT" ]; then echo "note: $SCRIPT not found; building without the built-in tentacle"; exit 0; fi
          bash "$SCRIPT"
        basedOnDependencyAnalysis: false
        # The script adds KrakiTentacleVersion to the processed Info.plist, so
        # it must run after Xcode writes it; without this input an incremental
        # build can process Info.plist afterwards and drop the key.
        inputFiles:
          - $(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)
    dependencies:
      - package: GRDB
      - package: Pulse
      - package: Highlightr
      - package: VoiceInputCore
      - package: Sparkle
