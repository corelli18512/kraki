<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#020617" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <script>
      // Kraki for Mac sign-in: GitHub redirects here (a sub-path of the
      // registered /auth/callback), and we hand code+state to the app through
      // its kraki:// callback. The PKCE verifier lives only in the app, so the
      // code is useless to anyone else. Stop the web app from loading.
      (function() {
        if (location.pathname.indexOf('/auth/callback/desktop') !== 0) return;
        var target = 'kraki://auth/callback' + location.search;
        window.stop();
        // The parser is halted mid-head: build the page with DOM calls (no
        // markup strings, which the bundler would rewrite).
        var root = document.documentElement;
        while (root.firstChild) root.removeChild(root.firstChild);
        root.appendChild(document.createElement('head'));
        document.title = 'Kraki';
        var body = document.createElement('body');
        body.style.cssText = 'font:15px -apple-system,sans-serif;text-align:center;padding-top:22vh;color:#334155';
        var line = function(tag, text, css) {
          var el = document.createElement(tag); el.textContent = text;
          if (css) el.style.cssText = css;
          body.appendChild(el); return el;
        };
        line('p', 'You\u2019re signed in', 'font-size:18px;font-weight:600');
        line('p', 'Return to Kraki to finish setting up.');
        var link = line('a', 'Open Kraki');
        link.href = target;
        root.appendChild(body);
        location.replace(target);
      })();
    </script>
    <script>
      // Apply dark mode before first paint to avoid flash and iOS PWA white status bar
      (function() {
        var t = localStorage.getItem('kraki-theme');
        var dark = t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('dark');
      })();
    </script>
    <title>Kraki — Agent Control</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@800&display=swap" rel="stylesheet" />
    <meta property="og:title" content="Kraki — Agent Control" />
    <meta property="og:description" content="E2E encrypted relay for AI coding agents" />
    <meta property="og:image" content="/icon-512.png" />
    <meta property="og:type" content="website" />
  </head>
  <body class="bg-white text-slate-900 dark:bg-slate-950 dark:text-slate-100 antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
