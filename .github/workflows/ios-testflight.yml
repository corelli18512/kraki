name: iOS TestFlight

on:
  workflow_dispatch:
    inputs:
      diagnostics:
        description: Explicit interim diagnostics delivery (normal releases stay disabled)
        required: false
        default: false
        type: boolean
      version:
        description: Marketing version to upload (for example 0.1.1)
        required: true
        type: string
  push:
    tags:
      - "ios-v*"

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  KRAKI_BUILD_CHANNEL: release

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  upload-testflight:
    name: Archive and upload iOS to TestFlight
    runs-on: macos-26
    timeout-minutes: 60
    environment: ios-release

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Resolve release version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/ios-v* ]]; then
            VERSION="${GITHUB_REF_NAME#ios-v}"
          else
            VERSION="$INPUT_VERSION"
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid iOS marketing version: $VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Embed build identity
        env:
          VERSION: ${{ steps.version.outputs.version }}
          KRAKI_BUILD_NUMBER: ${{ steps.version.outputs.build }}
        run: node scripts/release/build-info.mjs packages/arm/ios/Kraki/Resources/build-info.json ios "$VERSION"

      - name: Cache Swift packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            packages/arm/ios/.build
            ~/Library/Developer/Xcode/DerivedData/*/SourcePackages
          key: ios-release-spm-${{ hashFiles('packages/arm/ios/Kraki.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: ios-release-spm-

      - name: Install App Store Connect API key
        env:
          API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          set -euo pipefail
          test -n "$API_KEY_BASE64"
          test -n "$API_KEY_ID"
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          echo "$API_KEY_BASE64" | base64 --decode > "$HOME/.appstoreconnect/private_keys/AuthKey_${API_KEY_ID}.p8"
          chmod 600 "$HOME/.appstoreconnect/private_keys/AuthKey_${API_KEY_ID}.p8"

      - name: Install App Store signing assets
        env:
          CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          APP_PROFILE_BASE64: ${{ secrets.IOS_APP_STORE_PROFILE_BASE64 }}
          NOTIFICATION_PROFILE_BASE64: ${{ secrets.IOS_NOTIFICATION_APP_STORE_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$CERTIFICATE_BASE64"
          test -n "$APP_PROFILE_BASE64"
          test -n "$NOTIFICATION_PROFILE_BASE64"
          KEYCHAIN_PATH="$RUNNER_TEMP/ios-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          echo "$CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/ios-distribution.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/ios-distribution.p12" \
            -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$APP_PROFILE_BASE64" | base64 --decode \
            > "$HOME/Library/MobileDevice/Provisioning Profiles/Kraki-App-Store-CI.mobileprovision"
          echo "$NOTIFICATION_PROFILE_BASE64" | base64 --decode \
            > "$HOME/Library/MobileDevice/Provisioning Profiles/Kraki-Notification-App-Store-CI.mobileprovision"

      - name: Archive Kraki for App Store Connect
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ steps.version.outputs.build }}
          BUILD_CONFIGURATION: ${{ inputs.diagnostics == true && 'DiagnosticsDelivery' || 'Release' }}
        run: |
          set -euo pipefail
          cd packages/arm/ios
          xcodebuild \
            -project Kraki.xcodeproj \
            -scheme Kraki \
            -configuration "$BUILD_CONFIGURATION" \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Kraki.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData-iOS" \
            DEVELOPMENT_TEAM=3A83X5JZ3S \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            archive

      - name: Validate archive metadata
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ steps.version.outputs.build }}
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/Kraki.xcarchive/Products/Applications/Kraki.app"
          test -d "$APP"
          cmp packages/arm/ios/Kraki/Resources/build-info.json "$APP/build-info.json"
          if [ '${{ inputs.diagnostics }}' = 'true' ]; then
            bash scripts/diag/verify-diagnostic-delivery.sh "$APP"
          else
            bash scripts/diag/verify-production.sh "$APP"
          fi
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist")" = "$VERSION"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist")" = "$BUILD_NUMBER"
          # Keep both shipped bundles iPhone-only until a dedicated iPad layout exists.
          for BUNDLE in "$APP" "$APP/PlugIns/KrakiNotification.appex"; do
            test "$(/usr/libexec/PlistBuddy -c 'Print :UIDeviceFamily:0' "$BUNDLE/Info.plist")" = "1"
            if /usr/libexec/PlistBuddy -c 'Print :UIDeviceFamily:1' "$BUNDLE/Info.plist" >/dev/null 2>&1; then
              echo "Unexpected additional device family in $BUNDLE" >&2
              exit 1
            fi
          done
          codesign --verify --strict --verbose=2 "$APP"
          codesign --verify --strict --verbose=2 "$APP/PlugIns/KrakiNotification.appex"

      - name: Verify matching debug symbols
        run: |
          set -euo pipefail
          ARCHIVE="$RUNNER_TEMP/Kraki.xcarchive"
          APP="$ARCHIVE/Products/Applications/Kraki.app"
          : > "$RUNNER_TEMP/ios-symbol-uuids.txt"
          for BUNDLE in "$APP" "$APP/PlugIns/KrakiNotification.appex"; do
            EXECUTABLE="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$BUNDLE/Info.plist")"
            DSYM="$ARCHIVE/dSYMs/$(basename "$BUNDLE").dSYM"
            BINARY_UUIDS="$(xcrun dwarfdump --uuid "$BUNDLE/$EXECUTABLE" | awk '{print $2, $3}' | sort)"
            SYMBOL_UUIDS="$(xcrun dwarfdump --uuid "$DSYM" | awk '{print $2, $3}' | sort)"
            test -n "$BINARY_UUIDS"
            test "$BINARY_UUIDS" = "$SYMBOL_UUIDS"
            printf '%s: %s\n' "$EXECUTABLE" "$BINARY_UUIDS" | tee -a "$RUNNER_TEMP/ios-symbol-uuids.txt"
          done

      - name: Export IPA
        run: |
          set -euo pipefail
          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/Kraki.xcarchive" \
            -exportPath "$RUNNER_TEMP/ios-export" \
            -exportOptionsPlist packages/arm/ios/ExportOptions-AppStore.plist
          test -f "$RUNNER_TEMP/ios-export/Kraki.ipa"

      - name: Prepare final IPA provenance
        env:
          VERSION: ${{ steps.version.outputs.version }}
          KRAKI_BUILD_NUMBER: ${{ steps.version.outputs.build }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ios-provenance"
          cp "$RUNNER_TEMP/ios-export/Kraki.ipa" "$RUNNER_TEMP/ios-provenance/Kraki.ipa"
          unzip -p "$RUNNER_TEMP/ios-provenance/Kraki.ipa" Payload/Kraki.app/build-info.json > "$RUNNER_TEMP/exported-build-info.json"
          cmp packages/arm/ios/Kraki/Resources/build-info.json "$RUNNER_TEMP/exported-build-info.json"
          node scripts/release/artifacts.mjs manifest "$RUNNER_TEMP/ios-provenance" ios "$VERSION"

      - name: Attest final IPA and release manifest
        id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: '${{ runner.temp }}/ios-provenance/*'

      - name: Verify provenance before submitting to Apple
        env:
          GH_TOKEN: ${{ github.token }}
          PROVENANCE_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          set -euo pipefail
          node scripts/release/artifacts.mjs verify "$RUNNER_TEMP/ios-provenance" "$PROVENANCE_BUNDLE"
          cp "$PROVENANCE_BUNDLE" "$RUNNER_TEMP/ios-provenance/provenance.json"

      - name: Upload IPA to TestFlight
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          xcrun altool --upload-app \
            --type ios \
            --file "$RUNNER_TEMP/ios-provenance/Kraki.ipa" \
            --apiKey "$API_KEY_ID" \
            --apiIssuer "$API_ISSUER_ID"

      - name: Publish durable iOS build record
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ steps.version.outputs.build }}
        run: |
          set -euo pipefail
          # One record per attempt; never overwrite another build's proof.
          TAG="ios-build-${VERSION}-${BUILD_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          NOTES="$RUNNER_TEMP/ios-build-notes.md"
          {
            if [ -f "release-notes/ios-v$VERSION.md" ]; then cat "release-notes/ios-v$VERSION.md"; echo; fi
            echo "Source: https://github.com/$GITHUB_REPOSITORY/commit/$GITHUB_SHA"
            echo "Build: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT"
            echo
            echo "Version $VERSION, build $BUILD_NUMBER (chat.kraki.ios). Submitted to Apple; processing/availability is managed by Apple."
            echo "These attestations cover the uploaded IPA, not the app after Apple's distribution processing."
            echo "The IPA is retained in the workflow artifacts; the signed manifest and proof below are the durable public record."
          } > "$NOTES"
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --latest=false --prerelease --title "iOS $VERSION ($BUILD_NUMBER), attempt $GITHUB_RUN_ATTEMPT" \
            --notes-file "$NOTES" \
            "$RUNNER_TEMP/ios-provenance/release-manifest.json" \
            "$RUNNER_TEMP/ios-provenance/SHA256SUMS.txt" \
            "$RUNNER_TEMP/ios-provenance/provenance.json"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/ios-public-record"
          for FILE in release-manifest.json SHA256SUMS.txt provenance.json; do
            cmp "$RUNNER_TEMP/ios-provenance/$FILE" "$RUNNER_TEMP/ios-public-record/$FILE"
          done

      - name: Upload release diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-testflight-${{ steps.version.outputs.version }}-${{ steps.version.outputs.build }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/ios-export
            ${{ runner.temp }}/ios-provenance/*.json
            ${{ runner.temp }}/ios-provenance/SHA256SUMS.txt
            ${{ runner.temp }}/Kraki.xcarchive/Info.plist
            ${{ runner.temp }}/Kraki.xcarchive/dSYMs
            ${{ runner.temp }}/ios-symbol-uuids.txt
            ${{ runner.temp }}/DerivedData-iOS/Logs
          if-no-files-found: ignore
          retention-days: 90
