name: Network resilience (full)

# Full G1–G10 matrix (docs/network-resilience-test-plan.md), including the long
# outage/offline scenarios and seeded random chaos. Nightly and on demand; not a
# merge gate. Local only: an isolated Head/Tentacle stack on the runner.
on:
  schedule:
    - cron: '17 19 * * *'
  workflow_dispatch:
    inputs:
      seed:
        description: Random-chaos seed (default is the run number, printed in the results)
        required: false
        type: string
      iterations:
        description: Random-chaos rounds
        required: false
        default: '50'
        type: string

permissions:
  contents: read

jobs:
  full:
    name: Network resilience (full matrix + chaos)
    runs-on: macos-26
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v6
      - run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
      - run: corepack enable
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install and build the local stack
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @kraki/protocol --filter @kraki/crypto --filter @kraki/head --filter @kraki/tentacle --filter @kraki/voice-broker build
      - run: brew install xcodegen
      - name: Full scenario matrix and random chaos
        env:
          CHAOS_SEED: ${{ inputs.seed || github.run_number }}
          CHAOS_ITERATIONS: ${{ inputs.iterations || '50' }}
        run: |
          echo "Random chaos seed=$CHAOS_SEED iterations=$CHAOS_ITERATIONS"
          bash scripts/chaos/run-native.sh
      - name: Upload resilience evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: network-resilience-full
          path: |
            /tmp/kraki-chaos/results
            /tmp/kraki-chaos/timeline.json
            /tmp/kraki-chaos/stack.log
            /tmp/kraki-chaos/xcode.log
          if-no-files-found: ignore
          retention-days: 30
