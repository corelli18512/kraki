name: Network resilience (full)

# Full G1–G10 matrix (docs/network-resilience-test-plan.md), including the long
# outage/offline scenarios and seeded random chaos. Nightly and on demand; not a
# merge gate. Local only: an isolated Head/Tentacle stack on the runner.
on:
  schedule:
    - cron: '17 19 * * *'
  workflow_dispatch:
    inputs:
      seed:
        description: Random-chaos seed (default is the run number, printed in the results)
        required: false
        type: string
      iterations:
        description: Random-chaos rounds
        required: false
        default: '50'
        type: string
      soak_minutes:
        description: Web soak length per seed (minutes)
        required: false
        default: '30'
        type: string
      soak_repeats:
        description: Web soak seeds to run (seed, seed+1, …)
        required: false
        default: '1'
        type: string

permissions:
  contents: read

jobs:
  full:
    name: Network resilience (full matrix + chaos)
    runs-on: macos-26
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v6
      - run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
      - run: corepack enable
      - uses: actions/setup-node@v6
        with:
          # Same runtime as the production Head (see ci.yml).
          node-version: '24.16.0'
          cache: pnpm
      - name: Install and build the local stack
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @kraki/protocol --filter @kraki/crypto --filter @kraki/head --filter @kraki/tentacle --filter @kraki/voice-broker build
      - run: brew install xcodegen
      - name: Full scenario matrix and random chaos
        env:
          CHAOS_SEED: ${{ inputs.seed || github.run_number }}
          CHAOS_ITERATIONS: ${{ inputs.iterations || '50' }}
        run: |
          echo "Random chaos seed=$CHAOS_SEED iterations=$CHAOS_ITERATIONS"
          bash scripts/chaos/run-native.sh
      - name: Upload resilience evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: network-resilience-full
          path: |
            /tmp/kraki-chaos/results
            /tmp/kraki-chaos/timeline.json
            /tmp/kraki-chaos/stack.log
            /tmp/kraki-chaos/xcode.log
          if-no-files-found: ignore
          retention-days: 30

  web-soak:
    # The web client for a long randomized soak: proxy faults (resets,
    # blackholes, outages, throttling) plus packet-level netem profiles,
    # agent bursts and page reloads. Exactly-once, no false "Not delivered",
    # bounded JS heap.
    name: Web soak (netem + chaos)
    runs-on: ubuntu-latest
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v6
      - run: corepack enable
      - uses: actions/setup-node@v6
        with:
          node-version: '24.16.0'
          cache: pnpm
      - name: Install and build the local stack
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @kraki/protocol --filter @kraki/crypto --filter @kraki/head --filter @kraki/tentacle --filter @kraki/voice-broker build
      - name: Web scenarios, netem matrix and 30-minute soak
        env:
          KRAKI_PW_CHANNEL: chrome
          KRAKI_NETEM: '1'
          KRAKI_SOAK_MINUTES: ${{ inputs.soak_minutes || '30' }}
          CHAOS_SEED: ${{ inputs.seed || github.run_number }}
          SOAK_REPEATS: ${{ inputs.soak_repeats || '1' }}
        run: |
          echo "Soak seed=$CHAOS_SEED minutes=$KRAKI_SOAK_MINUTES repeats=$SOAK_REPEATS"
          set +e
          bash scripts/chaos/run-web.sh; first=$?
          second=0
          if [ "$SOAK_REPEATS" -gt 1 ]; then
            mv /tmp/kraki-chaos /tmp/kraki-chaos-main
            bash scripts/chaos/run-web.sh -g S1 --repeat-each "$SOAK_REPEATS"; second=$?
          fi
          [ $first -eq 0 ] && [ $second -eq 0 ]
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: network-resilience-web-soak
          path: |
            /tmp/kraki-chaos/results
            /tmp/kraki-chaos/stack.out
            /tmp/kraki-chaos-main/results
            /tmp/kraki-chaos-main/web.log
            /tmp/kraki-chaos-main/stack.out
            /tmp/kraki-chaos/web.log
            /tmp/kraki-chaos/web-report.json
            /tmp/kraki-chaos/stack.log
            packages/arm/web/test-results
          if-no-files-found: ignore
          retention-days: 30

