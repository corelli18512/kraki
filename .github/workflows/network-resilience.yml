name: Network resilience (full)

# Full G1–G10 matrix (docs/network-resilience-test-plan.md), including the long
# outage/offline scenarios and seeded random chaos. Manual only (Actions → Run
# workflow); never scheduled, not a merge gate. Local stack on the runner.
on:
  workflow_dispatch:
    inputs:
      seed:
        description: Random-chaos seed (default is the run number, printed in the results)
        required: false
        type: string
      iterations:
        description: Random-chaos rounds
        required: false
        default: '50'
        type: string

permissions:
  contents: read

jobs:
  full:
    name: Network resilience (full matrix + chaos)
    runs-on: macos-26
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
      - run: corepack enable
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          # Same runtime as the production Head (see ci.yml).
          node-version: '24.16.0'
          cache: pnpm
      - name: Install and build the local stack
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @kraki/protocol --filter @kraki/crypto --filter @kraki/head --filter @kraki/tentacle --filter @kraki/voice-broker build
      - run: brew install xcodegen
      - name: Full scenario matrix and random chaos
        env:
          CHAOS_SEED: ${{ inputs.seed || github.run_number }}
          CHAOS_ITERATIONS: ${{ inputs.iterations || '50' }}
        run: |
          echo "Random chaos seed=$CHAOS_SEED iterations=$CHAOS_ITERATIONS"
          bash scripts/chaos/run-native.sh
      - name: Upload resilience evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: network-resilience-full
          path: |
            /tmp/kraki-chaos/results
            /tmp/kraki-chaos/timeline.json
            /tmp/kraki-chaos/stack.log
            /tmp/kraki-chaos/xcode.log
          if-no-files-found: ignore
          retention-days: 30
