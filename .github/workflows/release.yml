name: Release

on:
  push:
    tags:
      - 'v*'
      - 'head-v*'
      - 'mac-v*'
  workflow_dispatch:
    inputs:
      mode:
        description: Release mode
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - publish
          - prerelease
      tag:
        description: Existing tag to build from (required for publish); prerelease mode names dogfood-cli or dogfood-mac
        required: false
        type: string
      target:
        description: Component to build in dry-run or prerelease mode
        required: true
        default: tentacle
        type: choice
        options:
          - tentacle
          - mac
      notarize:
        description: Notarize (and staple) a dry-run build (for clean-machine testing; never published)
        required: false
        default: false
        type: boolean
      # Prerelease mode is dispatched by prerelease.yml on main to replace the
      # rolling dogfood-cli / dogfood-mac release; see docs/dogfood.md.
      prerelease_sha:
        description: 'Prerelease only: the main commit to build (must be what main points at)'
        required: false
        type: string
      prerelease_version:
        description: 'Prerelease only: version (CLI 0.38.12-dev.57, Mac 0.2.92-dev.57)'
        required: false
        type: string
      prerelease_bundle_build:
        description: 'Prerelease only (Mac): CFBundleVersion, e.g. 93.57'
        required: false
        type: string
      prerelease_tentacle_version:
        description: 'Prerelease only (Mac): version of the embedded tentacle'
        required: false
        type: string
      prerelease_base:
        description: 'Prerelease only: previous dogfood commit or formal tag, for the changelog'
        required: false
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write
  checks: read

concurrency:
  # A newer prerelease of the same component cancels an in-progress one;
  # formal releases are never cancelled.
  group: ${{ github.event.inputs.mode == 'prerelease' && format('prerelease-{0}', github.event.inputs.target) || format('release-{0}', github.ref_name) }}
  cancel-in-progress: ${{ github.event.inputs.mode == 'prerelease' }}

env:
  # Dogfood (prerelease mode) builds come only from this branch.
  DOGFOOD_BRANCH: main
  KRAKI_BUILD_CHANNEL: ${{ (github.event_name == 'push' || github.event.inputs.mode == 'publish' || github.event.inputs.mode == 'prerelease') && 'release' || 'ci' }}

# ─── Prepare ─────────────────────────────────────────────

jobs:
  prepare:
    name: Prepare Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      checkout_ref: ${{ steps.meta.outputs.checkout_ref }}
      publish_mode: ${{ steps.meta.outputs.publish_mode }}
      release_sha: ${{ steps.meta.outputs.release_sha }}
      release_tag: ${{ steps.meta.outputs.release_tag }}
      prerelease_version: ${{ steps.prerelease.outputs.version }}
      prerelease_bundle_build: ${{ steps.prerelease.outputs.bundle_build }}
      prerelease_tentacle_version: ${{ steps.prerelease.outputs.tentacle_version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Resolve target ref
        id: meta
        env:
          INPUT_MODE: ${{ github.event.inputs.mode || 'dry-run' }}
          INPUT_TAG: ${{ github.event.inputs.tag || '' }}
        run: |
          set -euo pipefail

          publish_mode="dry-run"
          checkout_ref="${GITHUB_SHA}"
          release_tag=""

          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            publish_mode="publish"
            release_tag="${GITHUB_REF_NAME}"
            checkout_ref="${release_tag}"
          elif [ "${INPUT_MODE}" = "publish" ]; then
            publish_mode="publish"
            release_tag="${INPUT_TAG}"
            if [ -z "${release_tag}" ]; then
              echo "workflow_dispatch publish requires inputs.tag"
              exit 1
            fi
            checkout_ref="${release_tag}"
          elif [ "${INPUT_MODE}" = "prerelease" ]; then
            # Built from main itself (checked below); the tag is the rolling
            # dogfood release it replaces.
            publish_mode="prerelease"
            release_tag="${INPUT_TAG}"
            checkout_ref="${GITHUB_SHA}"
          else
            # Dry-run validates the exact branch/ref selected in the workflow
            # dispatch. It never publishes, so it need not already be on main.
            checkout_ref="${GITHUB_SHA}"
          fi

          git checkout --detach "${checkout_ref}"
          release_sha="$(git rev-parse HEAD)"
          # Attestation certificates describe the workflow ref, not arbitrary
          # code checked out later. Never claim one source while building another.
          if [ "$release_sha" != "$GITHUB_SHA" ]; then
            echo "Dispatch this workflow on the release tag itself (gh workflow run release.yml --ref TAG), not main."
            exit 1
          fi

          {
            echo "checkout_ref=${checkout_ref}"
            echo "publish_mode=${publish_mode}"
            echo "release_sha=${release_sha}"
            echo "release_tag=${release_tag}"
          } >> "$GITHUB_OUTPUT"

      - name: Ensure release source is main
        if: steps.meta.outputs.publish_mode == 'publish'
        run: |
          set -euo pipefail
          git fetch origin main
          git merge-base --is-ancestor "${{ steps.meta.outputs.release_sha }}" origin/main || {
            echo "Release target must point to a commit on main."
            exit 1
          }

      - name: Ensure dogfood source is main
        if: steps.meta.outputs.publish_mode == 'prerelease'
        env:
          EXPECTED_SHA: ${{ github.event.inputs.prerelease_sha }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/$DOGFOOD_BRANCH" ]; then
            echo "Dogfood builds run only on $DOGFOOD_BRANCH (gh workflow run release.yml --ref $DOGFOOD_BRANCH), not $GITHUB_REF."
            exit 1
          fi
          if [ "$GITHUB_SHA" != "$EXPECTED_SHA" ]; then
            echo "$DOGFOOD_BRANCH moved to $GITHUB_SHA after $EXPECTED_SHA was planned; the newer commit's CI dogfoods it."
            exit 1
          fi
          git fetch origin "$DOGFOOD_BRANCH"
          git merge-base --is-ancestor "$GITHUB_SHA" "origin/$DOGFOOD_BRANCH" || {
            echo "Dogfood source must be a commit on $DOGFOOD_BRANCH."
            exit 1
          }

      - name: Ensure CI passed for this commit
        if: steps.meta.outputs.publish_mode == 'publish' || steps.meta.outputs.publish_mode == 'prerelease'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.meta.outputs.release_sha }}
        run: |
          set -euo pipefail
          echo "Checking CI status for ${RELEASE_SHA}..."

          for i in $(seq 1 30); do
            status=$(gh api "repos/${{ github.repository }}/commits/${RELEASE_SHA}/check-runs" \
              --jq '.check_runs[] | select(.name == "Validate") | .conclusion' 2>/dev/null | head -1 || true)

            if [ "${status}" = "success" ]; then
              echo "CI passed ✅"
              exit 0
            fi

            case "${status}" in
              failure|cancelled|timed_out|action_required)
                echo "CI status is ${status}. Refusing to release."
                exit 1
                ;;
            esac

            echo "CI status: ${status:-pending}. Waiting 10s... (attempt ${i}/30)"
            sleep 10
          done

          echo "CI did not complete within 5 minutes. Refusing to release."
          exit 1

      - name: Verify tag matches package version
        if: steps.meta.outputs.publish_mode == 'publish'
        run: |
          set -euo pipefail
          TAG="${{ steps.meta.outputs.release_tag }}"

          if [[ "$TAG" == head-v* ]]; then
            TAG_VERSION="${TAG#head-v}"
            PKG_VERSION=$(node -p "require('./packages/head/package.json').version")
            PKG_NAME="@kraki/head"
          elif [[ "$TAG" == mac-v* ]]; then
            TAG_VERSION="${TAG#mac-v}"
            # -diag selects DiagnosticsDelivery; CFBundle versions stay numeric.
            TAG_VERSION="${TAG_VERSION%-diag}"
            PKG_VERSION=$(awk '
              /^targets:/ { in_targets=1; next }
              in_targets && /^  KrakiMac:/ { in_mac=1; next }
              in_mac && /^  [A-Za-z0-9_]+:/ { exit }
              in_mac && /MARKETING_VERSION:/ {
                value=$2
                gsub(/"/, "", value)
                print value
                exit
              }
            ' packages/arm/ios/project.yml)
            test -n "$PKG_VERSION" || { echo "KrakiMac MARKETING_VERSION not found"; exit 1; }
            PKG_NAME="kraki-mac-gui"
          elif [[ "$TAG" == v* ]]; then
            TAG_VERSION="${TAG#v}"
            PKG_VERSION=$(node -p "require('./packages/tentacle/package.json').version")
            PKG_NAME="@kraki/tentacle"
          else
            echo "Unknown tag prefix: $TAG (expected v*, head-v*, or mac-v*)"
            exit 1
          fi

          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) does not match $PKG_NAME version ($PKG_VERSION)"
            exit 1
          fi
          echo "Version: $PKG_NAME@$PKG_VERSION ✅"

      - name: Verify prerelease identity
        id: prerelease
        if: steps.meta.outputs.publish_mode == 'prerelease'
        env:
          TAG: ${{ steps.meta.outputs.release_tag }}
          TARGET: ${{ github.event.inputs.target }}
          VERSION: ${{ github.event.inputs.prerelease_version }}
          BUNDLE_BUILD: ${{ github.event.inputs.prerelease_bundle_build }}
          TENTACLE_VERSION: ${{ github.event.inputs.prerelease_tentacle_version }}
        run: |
          set -euo pipefail
          # Only the two rolling dogfood releases, never a formal tag: the CLI
          # updater and this workflow's publish jobs match v*, mac-v* and head-v*.
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-dev\.[1-9][0-9]*$ ]]
          case "$TARGET" in
            tentacle)
              test "$TAG" = "dogfood-cli"
              TENTACLE_VERSION="$VERSION"
              BUNDLE_BUILD=""
              ;;
            mac)
              test "$TAG" = "dogfood-mac"
              [[ "$BUNDLE_BUILD" =~ ^[1-9][0-9]*\.[1-9][0-9]*$ ]]
              [[ "$TENTACLE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-dev\.[1-9][0-9]*$ ]]
              ;;
            *) echo "Unknown prerelease target: $TARGET"; exit 1 ;;
          esac
          {
            echo "version=$VERSION"
            echo "bundle_build=$BUNDLE_BUILD"
            echo "tentacle_version=$TENTACLE_VERSION"
          } >> "$GITHUB_OUTPUT"
          echo "Prerelease $TAG ($TARGET) ✅"

  # ─── Build Tentacle Binary ───────────────────────────────

  build-binary:
    name: Build Binary (${{ matrix.label }})
    needs: prepare
    # Skip for head-only releases — the binary build is tentacle-specific.
    if: |
      (github.event_name == 'push' && startsWith(github.ref_name, 'v') && !startsWith(github.ref_name, 'head-v'))
      || (github.event_name == 'workflow_dispatch' &&
          ((github.event.inputs.mode == 'dry-run' && github.event.inputs.target == 'tentacle') ||
           (github.event.inputs.mode == 'prerelease' && github.event.inputs.target == 'tentacle') ||
           (startsWith(github.event.inputs.tag, 'v') && !startsWith(github.event.inputs.tag, 'head-v'))))
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            label: Linux x64
            asset_name: kraki-cli-linux-x64
          - runner: macos-15-intel
            label: macOS x64
            asset_name: kraki-cli-macos-x64
            # Stapled by staple-macos-x64 on an arm64 runner: from the Intel
            # runner, the stapler keeps losing its connection to Apple's ticket
            # service (NSURLErrorDomain -1005) even after the notarization is
            # accepted.
            staple_app: false
          - runner: macos-14
            label: macOS arm64
            asset_name: kraki-cli-macos-arm64
            staple_app: true
          - runner: windows-2022
            label: Windows x64
            asset_name: kraki-cli-windows-x64.exe

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.release_sha }}

      - name: Enable corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install tentacle build dependencies
        run: pnpm install --frozen-lockfile --filter @kraki/tentacle...

      - name: Stamp prerelease version
        if: needs.prepare.outputs.publish_mode == 'prerelease'
        run: node scripts/release/prerelease.mjs stamp-tentacle "${{ needs.prepare.outputs.prerelease_tentacle_version }}"

      - name: Run tentacle binary tests
        run: pnpm --filter @kraki/tentacle exec vitest run src/adapters/__tests__/copilot.test.ts src/__tests__/daemon.test.ts src/__tests__/cli.test.ts src/__tests__/logger.test.ts

      - name: Build tentacle binary
        run: pnpm --filter @kraki/tentacle run build:binary:local

      - name: Import Apple certificate
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          security create-keychain -p "" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "" "$KEYCHAIN_PATH"
          echo "$APPLE_CERTIFICATE" | base64 --decode > $RUNNER_TEMP/cert.p12
          security import $RUNNER_TEMP/cert.p12 -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

      - name: Sign binary (macOS)
        if: runner.os == 'macOS'
        run: |
          codesign --force --options runtime \
            --entitlements packages/tentacle/entitlements.plist \
            --sign "${{ secrets.APPLE_SIGNING_IDENTITY }}" \
            packages/tentacle/dist/sea/${{ matrix.asset_name }}

      - name: Create .app bundle (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          BINARY="packages/tentacle/dist/sea/${{ matrix.asset_name }}"
          # A dogfood version (0.39.0-dev.12) keeps CFBundleVersion numeric
          # (0.39.0); CFBundleShortVersionString and --version show it whole.
          VERSION=$(node -p "require('./packages/tentacle/package.json').version")
          APP_DIR="packages/tentacle/dist/sea/Kraki.app"

          mkdir -p "$APP_DIR/Contents/MacOS" "$APP_DIR/Contents/Resources"
          cp "$BINARY" "$APP_DIR/Contents/MacOS/kraki"

          # Ship a real icon so the CLI's Kraki.app is visually distinct from
          # a generic binary in System Settings / Finder / Dock. Generated
          # from the repo's brand logo.png (the canonical kraki identity) so
          # the CLI carries the right icon regardless of any other package.
          # sips + iconutil ship with macOS and are present on GitHub macos runners.
          ICONSET="$APP_DIR/Contents/Resources/app.iconset"
          mkdir -p "$ICONSET"
          for spec in "16 16" "32 16@2x" "32 32" "64 32@2x" "128 128" "256 128@2x" \
                      "256 256" "512 256@2x" "512 512" "1024 512@2x"; do
            set -- $spec; sz=$1; nm=$2
            sips -z "$sz" "$sz" logo.png --out "$ICONSET/icon_${nm}.png" >/dev/null
          done
          iconutil -c icns "$ICONSET" -o "$APP_DIR/Contents/Resources/app.icns"
          rm -rf "$ICONSET"

          cat > "$APP_DIR/Contents/Info.plist" << PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleIdentifier</key>
              <string>chat.kraki.cli</string>
              <key>CFBundleName</key>
              <string>Kraki CLI</string>
              <key>CFBundleExecutable</key>
              <string>kraki</string>
              <key>CFBundleIconFile</key>
              <string>app</string>
              <key>CFBundleVersion</key>
              <string>${VERSION%%-*}</string>
              <key>CFBundleShortVersionString</key>
              <string>${VERSION}</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>LSUIElement</key>
              <true/>
              <key>LSBackgroundOnly</key>
              <true/>
          </dict>
          </plist>
          PLIST
          # Agents run under this bundle; without usage strings macOS silently
          # denies their privacy requests (local network, Apple events, ...).
          /usr/libexec/PlistBuddy -c "Merge packages/tentacle/agent-privacy.plist" "$APP_DIR/Contents/Info.plist" >/dev/null

          # Sign inside-out: the nested executable first, then the bundle.
          # --deep is deprecated for signing and applies the OUTER entitlements to
          # every nested binary, which silently mis-signs anything added to the
          # bundle later.
          codesign --force --options runtime \
            --entitlements packages/tentacle/entitlements.plist \
            --sign "${{ secrets.APPLE_SIGNING_IDENTITY }}" \
            "$APP_DIR/Contents/MacOS/kraki"
          codesign --force --options runtime \
            --entitlements packages/tentacle/entitlements.plist \
            --sign "${{ secrets.APPLE_SIGNING_IDENTITY }}" \
            "$APP_DIR"

          codesign --verify --strict --verbose=2 "$APP_DIR"

          # The distribution tarball is NOT built here. It has to be created after
          # notarization + stapling, or it ships without the ticket and every user
          # needs a successful online Gatekeeper check to launch. See the
          # "Notarize" step below.

      - name: Notarize and staple (macOS)
        if: runner.os == 'macOS' && (needs.prepare.outputs.publish_mode == 'publish' || needs.prepare.outputs.publish_mode == 'prerelease' || github.event.inputs.notarize == 'true')
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail

          # Notarize the standalone binary
          zip $RUNNER_TEMP/binary.zip packages/tentacle/dist/sea/${{ matrix.asset_name }}
          xcrun notarytool submit $RUNNER_TEMP/binary.zip \
            --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" --wait
          # Mach-O binaries cannot be stapled (error 73); macOS verifies
          # the notarization ticket online at first launch instead.

          # Notarize the .app bundle
          zip -r $RUNNER_TEMP/app-bundle.zip packages/tentacle/dist/sea/Kraki.app
          xcrun notarytool submit $RUNNER_TEMP/app-bundle.zip \
            --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" --wait

          # Staple the ticket INTO the bundle. Unlike a bare Mach-O, an .app can
          # and must be stapled: without it every launch depends on a successful
          # online Gatekeeper check, so an offline or rate-limited machine sees
          # "damaged app" — and an app Gatekeeper refuses to launch has no TCC
          # grants at all.
          if [ "${{ matrix.staple_app }}" != "true" ]; then
            echo "Notarized; staple-macos-x64 staples this bundle on an arm64 runner."
            exit 0
          fi
          bash scripts/release/apple-retry.sh xcrun stapler staple packages/tentacle/dist/sea/Kraki.app
          bash scripts/release/apple-retry.sh xcrun stapler validate packages/tentacle/dist/sea/Kraki.app
          spctl -a -vvv --type exec packages/tentacle/dist/sea/Kraki.app

      - name: Package .app bundle (macOS)
        if: runner.os == 'macOS' && matrix.staple_app
        run: |
          set -euo pipefail
          # Packaged only after notarization + stapling, so the tarball carries
          # the ticket. Building it earlier is why the shipped bundle had no
          # stapled ticket despite the release being notarized.
          ARCH="${{ matrix.asset_name }}"
          ARCH="${ARCH#kraki-cli-macos-}"
          tar -czf "packages/tentacle/dist/sea/kraki-macos-${ARCH}.app.tar.gz" \
            -C packages/tentacle/dist/sea Kraki.app
          echo "Created kraki-macos-${ARCH}.app.tar.gz"
          ls -lh "packages/tentacle/dist/sea/kraki-macos-${ARCH}.app.tar.gz"

      - name: Smoke test tentacle binary
        run: node packages/tentacle/scripts/smoke-test-binary.mjs packages/tentacle/dist/sea/${{ matrix.asset_name }}

      - name: Smoke test background daemon
        if: runner.os != 'macOS'
        run: node packages/tentacle/scripts/daemon-release-smoke.mjs packages/tentacle/dist/sea/${{ matrix.asset_name }}

      - name: Smoke test macOS LaunchServices daemon
        if: runner.os == 'macOS'
        run: node packages/tentacle/scripts/daemon-release-smoke.mjs packages/tentacle/dist/sea/Kraki.app/Contents/MacOS/kraki

      - name: Upload binary artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-${{ matrix.asset_name }}-${{ github.run_attempt }}
          path: packages/tentacle/dist/sea/${{ matrix.asset_name }}
          if-no-files-found: error

      - name: Upload .app bundle artifact (macOS)
        if: runner.os == 'macOS' && matrix.staple_app
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-${{ matrix.asset_name }}-app-${{ github.run_attempt }}
          path: packages/tentacle/dist/sea/kraki-macos-*.app.tar.gz
          if-no-files-found: error

      - name: Package unstapled .app bundle (macOS x64)
        if: runner.os == 'macOS' && !matrix.staple_app
        run: |
          set -euo pipefail
          # Notarized (when this run notarizes) but not stapled. Never a
          # release asset: the artifact name is outside the build-kraki-*
          # pattern the publish job downloads.
          tar -czf "$RUNNER_TEMP/kraki-macos-x64.unstapled.app.tar.gz" \
            -C packages/tentacle/dist/sea Kraki.app

      - name: Upload unstapled .app bundle artifact (macOS x64)
        if: runner.os == 'macOS' && !matrix.staple_app
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unstapled-kraki-macos-x64-app-${{ github.run_attempt }}
          path: ${{ runner.temp }}/kraki-macos-x64.unstapled.app.tar.gz
          if-no-files-found: error

  # ─── Staple the macOS x64 CLI bundle ───────────────────

  staple-macos-x64:
    name: Staple .app bundle (macOS x64)
    needs:
      - prepare
      - build-binary
    # Runs whenever build-binary succeeded, so it is skipped with it (head-v*,
    # mac-v*, mac dry-runs). Publishing requires this job to succeed.
    runs-on: macos-14
    timeout-minutes: 20

    steps:
      - name: Check out release tooling
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}

      - name: Download unstapled .app bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: unstapled-kraki-macos-x64-app-${{ github.run_attempt }}
          path: ${{ runner.temp }}/unstapled

      - name: Unpack and verify signature
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/x64"
          tar -xzf "$RUNNER_TEMP/unstapled/kraki-macos-x64.unstapled.app.tar.gz" -C "$RUNNER_TEMP/x64"
          APP="$RUNNER_TEMP/x64/Kraki.app"
          test "$(lipo -archs "$APP/Contents/MacOS/kraki")" = "x86_64"
          codesign --verify --strict --verbose=2 "$APP"

      - name: Staple, validate and assess
        # Mandatory whenever the build was notarized: a release or dogfood
        # build never ships the x64 bundle without its ticket.
        if: needs.prepare.outputs.publish_mode == 'publish' || needs.prepare.outputs.publish_mode == 'prerelease' || github.event.inputs.notarize == 'true'
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/x64/Kraki.app"
          bash scripts/release/apple-retry.sh xcrun stapler staple "$APP"
          bash scripts/release/apple-retry.sh xcrun stapler validate "$APP"
          # A Gatekeeper assessment reads the signature and the stapled ticket;
          # it does not run the x86_64 executable, so it needs no Rosetta.
          spctl -a -vvv --type exec "$APP"
          test -f "$APP/Contents/CodeResources"

      - name: Package .app bundle
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/out"
          tar -czf "$RUNNER_TEMP/out/kraki-macos-x64.app.tar.gz" -C "$RUNNER_TEMP/x64" Kraki.app
          ls -lh "$RUNNER_TEMP/out/kraki-macos-x64.app.tar.gz"

      - name: Upload .app bundle artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-kraki-cli-macos-x64-app-${{ github.run_attempt }}
          path: ${{ runner.temp }}/out/kraki-macos-x64.app.tar.gz
          if-no-files-found: error

  # ─── Build macOS GUI App ───────────────────────────────

  build-mac-gui:
    name: Build macOS GUI App (universal)
    needs: prepare
    # Only for mac-v* releases. The archive is universal (arm64 + x86_64).
    if: |
      (github.event_name == 'push' && startsWith(github.ref_name, 'mac-v'))
      || (github.event_name == 'workflow_dispatch' &&
          ((github.event.inputs.mode == 'dry-run' && github.event.inputs.target == 'mac') ||
           (github.event.inputs.mode == 'prerelease' && github.event.inputs.target == 'mac') ||
           startsWith(github.event.inputs.tag, 'mac-v')))
    runs-on: macos-26
    timeout-minutes: 75

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}
          # Tags and history for the tentacle version-bump check.
          fetch-depth: 0

      - name: Check built-in tentacle version was bumped
        # A rebuilt helper with an unchanged version is not restarted after a
        # Sparkle update and loses macOS privacy access (see the script).
        # A prerelease stamps its own tentacle version instead (next step).
        if: needs.prepare.outputs.publish_mode != 'prerelease'
        run: scripts/mac/check-tentacle-version-bump.sh "${{ needs.prepare.outputs.release_sha }}"

      - name: Stamp prerelease tentacle version
        if: needs.prepare.outputs.publish_mode == 'prerelease'
        run: node scripts/release/prerelease.mjs stamp-tentacle "${{ needs.prepare.outputs.prerelease_tentacle_version }}"

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Resolve Swift packages cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            packages/arm/ios/.build
            ~/Library/Developer/Xcode/DerivedData/*/SourcePackages
          key: ${{ runner.os }}-spm-${{ hashFiles('packages/arm/ios/Kraki.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: ${{ runner.os }}-spm-

      - name: Import Apple certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          security create-keychain -p "" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "" "$KEYCHAIN_PATH"
          echo "$APPLE_CERTIFICATE" | base64 --decode > $RUNNER_TEMP/cert.p12
          security import $RUNNER_TEMP/cert.p12 -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

      - name: Enable corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Build built-in tentacle (universal, version-locked to this commit)
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          # Kraki for Mac ships the tentacle from the same commit. Every
          # tentacle release therefore needs a matching Mac release.
          pnpm install --frozen-lockfile --filter @kraki/tentacle...
          pnpm --filter @kraki/tentacle run build:binary:local
          node packages/tentacle/scripts/build-sea-darwin-cross.mjs
          bash scripts/mac/build-tentacle-helper.sh \
            --binary packages/tentacle/dist/sea/kraki-cli-macos-arm64 \
            --binary packages/tentacle/dist/sea/kraki-cli-macos-x64 \
            --out "$RUNNER_TEMP/tentacle-helper" \
            --sign "$APPLE_SIGNING_IDENTITY"
          HELPER="$RUNNER_TEMP/tentacle-helper/Kraki.app"
          test "$(lipo -archs "$HELPER/Contents/MacOS/kraki")" = "x86_64 arm64"
          "$HELPER/Contents/MacOS/kraki" --version
          if arch -x86_64 /usr/bin/true 2>/dev/null; then
            arch -x86_64 "$HELPER/Contents/MacOS/kraki" --version
          else
            echo "Rosetta unavailable; x86_64 slice verified by lipo only"
          fi
          node packages/tentacle/scripts/smoke-test-binary.mjs "$HELPER/Contents/MacOS/kraki"

      - name: Embed native build identity
        env:
          PRERELEASE_VERSION: ${{ needs.prepare.outputs.prerelease_version }}
        run: |
          if [ -n "$PRERELEASE_VERSION" ]; then
            node scripts/release/build-info.mjs packages/arm/ios/Kraki/Resources/build-info.json mac "$PRERELEASE_VERSION"
            exit 0
          fi
          VERSION=$(awk '
            /^targets:/ { in_targets=1; next }
            in_targets && /^  KrakiMac:/ { in_mac=1; next }
            in_mac && /^  [A-Za-z0-9_]+:/ { exit }
            in_mac && /MARKETING_VERSION:/ { gsub(/"/, "", $2); print $2; exit }
          ' packages/arm/ios/project.yml)
          node scripts/release/build-info.mjs packages/arm/ios/Kraki/Resources/build-info.json mac "$VERSION"

      - name: Archive KrakiMac (Developer ID; diagnostics only on explicit -diag tag)
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          BUILD_CONFIGURATION: ${{ endsWith(needs.prepare.outputs.release_tag, '-diag') && 'DiagnosticsDelivery' || 'Release' }}
          PRERELEASE_VERSION: ${{ needs.prepare.outputs.prerelease_version }}
          PRERELEASE_BUNDLE_BUILD: ${{ needs.prepare.outputs.prerelease_bundle_build }}
        run: |
          set -euo pipefail
          # A prerelease keeps a numeric short version and a CFBundleVersion
          # between two formal builds (docs/dogfood.md).
          VERSION_SETTINGS=()
          if [ -n "$PRERELEASE_VERSION" ]; then
            VERSION_SETTINGS=("MARKETING_VERSION=${PRERELEASE_VERSION%-dev.*}" "CURRENT_PROJECT_VERSION=$PRERELEASE_BUNDLE_BUILD")
          fi
          cd packages/arm/ios
          xcodebuild -project Kraki.xcodeproj -scheme KrakiMac \
            -configuration "$BUILD_CONFIGURATION" \
            -destination 'generic/platform=macOS' \
            -archivePath "$RUNNER_TEMP/KrakiMac.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGN_IDENTITY="$APPLE_SIGNING_IDENTITY" \
            DEVELOPMENT_TEAM=3A83X5JZ3S \
            CODE_SIGN_STYLE=Manual \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            KRAKI_TENTACLE_HELPER="$RUNNER_TEMP/tentacle-helper/Kraki.app" \
            KRAKI_REQUIRE_TENTACLE=1 \
            ${VERSION_SETTINGS[@]+"${VERSION_SETTINGS[@]}"} \
            archive | tail -40

      - name: Verify signature
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/KrakiMac.xcarchive/Products/Applications/Kraki.app"
          test -f "$APP/Contents/MacOS/Kraki"
          cmp packages/arm/ios/Kraki/Resources/build-info.json "$APP/Contents/Resources/build-info.json"
          if [ '${{ endsWith(needs.prepare.outputs.release_tag, '-diag') }}' = 'true' ]; then
            bash scripts/diag/verify-diagnostic-delivery.sh "$APP"
          else
            bash scripts/diag/verify-production.sh "$APP"
          fi
          codesign --verify --strict --verbose=2 "$APP"

      - name: Re-sign Sparkle helper tools for Developer ID
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/KrakiMac.xcarchive/Products/Applications/Kraki.app"
          SPARKLE="$APP/Contents/Frameworks/Sparkle.framework/Versions/B"
          ENTITLEMENTS="packages/arm/ios/Kraki/KrakiMac.entitlements"

          sign_code() {
            codesign --force --options runtime --timestamp \
              --sign "$APPLE_SIGNING_IDENTITY" "$1"
          }

          # SwiftPM ships these helpers with an ad-hoc signature. Sign from
          # the innermost Mach-O outward so each enclosing bundle seals the
          # already Developer ID-signed nested code.
          sign_code "$SPARKLE/Autoupdate"
          sign_code "$SPARKLE/XPCServices/Downloader.xpc/Contents/MacOS/Downloader"
          sign_code "$SPARKLE/XPCServices/Downloader.xpc"
          sign_code "$SPARKLE/XPCServices/Installer.xpc/Contents/MacOS/Installer"
          sign_code "$SPARKLE/XPCServices/Installer.xpc"
          sign_code "$SPARKLE/Updater.app/Contents/MacOS/Updater"
          sign_code "$SPARKLE/Updater.app"
          sign_code "$APP/Contents/Frameworks/Sparkle.framework"
          codesign --force --options runtime --timestamp \
            --entitlements "$ENTITLEMENTS" \
            --sign "$APPLE_SIGNING_IDENTITY" "$APP"

          codesign --verify --deep --strict --verbose=2 "$APP"
          for item in \
            "$SPARKLE/Autoupdate" \
            "$SPARKLE/Updater.app" \
            "$SPARKLE/XPCServices/Downloader.xpc" \
            "$SPARKLE/XPCServices/Installer.xpc" \
            "$APP/Contents/Frameworks/Sparkle.framework" \
            "$APP/Contents/Library/Helpers/Kraki.app" \
            "$APP"; do
            codesign -dv --verbose=4 "$item" 2>&1 | tee "$RUNNER_TEMP/$(basename "$item").codesign.txt"
            grep -q 'Authority=Developer ID Application:' "$RUNNER_TEMP/$(basename "$item").codesign.txt"
            grep -q 'TeamIdentifier=3A83X5JZ3S' "$RUNNER_TEMP/$(basename "$item").codesign.txt"
            grep -q 'Timestamp=' "$RUNNER_TEMP/$(basename "$item").codesign.txt"
          done

      - name: Notarize and staple
        if: needs.prepare.outputs.publish_mode == 'publish' || needs.prepare.outputs.publish_mode == 'prerelease' || github.event.inputs.notarize == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/KrakiMac.xcarchive/Products/Applications/Kraki.app"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$RUNNER_TEMP/Kraki.app.zip"
          set +e
          xcrun notarytool submit "$RUNNER_TEMP/Kraki.app.zip" \
            --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" --wait --output-format json \
            > "$RUNNER_TEMP/notary-submit.json"
          NOTARY_STATUS=$?
          set -e
          cat "$RUNNER_TEMP/notary-submit.json"
          SUBMISSION_ID=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("id", ""))' "$RUNNER_TEMP/notary-submit.json")
          NOTARY_RESULT=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("status", ""))' "$RUNNER_TEMP/notary-submit.json")
          if [ "$NOTARY_STATUS" -ne 0 ] || [ "$NOTARY_RESULT" != "Accepted" ]; then
            if [ -n "$SUBMISSION_ID" ]; then
              xcrun notarytool log "$SUBMISSION_ID" \
                --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" \
                --team-id "$APPLE_TEAM_ID" --output-format json \
                | tee "$RUNNER_TEMP/notary-log.json"
            fi
            test "$NOTARY_STATUS" -eq 0
            test "$NOTARY_RESULT" = "Accepted"
          fi
          bash scripts/release/apple-retry.sh xcrun stapler staple "$APP"
          bash scripts/release/apple-retry.sh xcrun stapler validate "$APP"
          spctl -a -vvv --type exec "$APP"

      - name: Verify architecture and distribution identity
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/KrakiMac.xcarchive/Products/Applications/Kraki.app"
          ARCHS=$(lipo -archs "$APP/Contents/MacOS/Kraki")
          echo "Architectures: $ARCHS"
          grep -qw arm64 <<< "$ARCHS"
          grep -qw x86_64 <<< "$ARCHS"
          codesign -dv --verbose=4 "$APP" 2>&1 | tee "$RUNNER_TEMP/codesign.txt"
          grep -q 'Authority=Developer ID Application:' "$RUNNER_TEMP/codesign.txt"
          grep -q 'TeamIdentifier=3A83X5JZ3S' "$RUNNER_TEMP/codesign.txt"

      - name: Package .app bundle
        env:
          PRERELEASE_BUNDLE_BUILD: ${{ needs.prepare.outputs.prerelease_bundle_build }}
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/KrakiMac.xcarchive/Products/Applications/Kraki.app"
          mkdir -p "$RUNNER_TEMP/stage"
          ditto "$APP" "$RUNNER_TEMP/stage/Kraki.app"
          # Package only after notarization/stapling. Do not strip xattrs here:
          # the stapled ticket is part of the signed distribution artifact.
          tar -czf "$RUNNER_TEMP/kraki-mac-gui-universal.app.tar.gz" \
            -C "$RUNNER_TEMP/stage" Kraki.app
          # Sparkle updates use a zip containing the notarized app bundle. A
          # dogfood build names it after its CFBundleVersion, so the dogfood
          # feed never points at an asset that is replaced in place
          # (scripts/release/dogfood-feed.mjs).
          SPARKLE_ARCHIVE=Kraki.app.zip
          if [ -n "$PRERELEASE_BUNDLE_BUILD" ]; then SPARKLE_ARCHIVE="Kraki-${PRERELEASE_BUNDLE_BUILD}.app.zip"; fi
          mkdir -p "$RUNNER_TEMP/sparkle-update"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$RUNNER_TEMP/sparkle-update/$SPARKLE_ARCHIVE"
          ls -lh "$RUNNER_TEMP/kraki-mac-gui-universal.app.tar.gz" "$RUNNER_TEMP/sparkle-update/$SPARKLE_ARCHIVE"

      - name: Preserve matching dSYMs for diagnostics
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mac-symbols-${{ needs.prepare.outputs.release_sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/KrakiMac.xcarchive/dSYMs
          retention-days: 90
          if-no-files-found: error

      - name: Upload Sparkle update archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-kraki-mac-sparkle-update-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sparkle-update/*.app.zip
          if-no-files-found: error

      - name: Generate dogfood Sparkle feed
        # appcast-dogfood.xml (scripts/release/dogfood-feed.mjs, docs/dogfood.md):
        # the production appcast's items plus this build, the newest two kept,
        # signed with the production Sparkle key. A Mac on the Dogfood channel
        # reads only this feed, so it also lists the newest formal release.
        # The mac-updates branch is only read here.
        if: needs.prepare.outputs.publish_mode == 'prerelease'
        env:
          GH_TOKEN: ${{ github.token }}
          SPARKLE_ED25519_PRIVATE_KEY: ${{ secrets.SPARKLE_ED25519_PRIVATE_KEY }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          BUNDLE_BUILD: ${{ needs.prepare.outputs.prerelease_bundle_build }}
        run: |
          set -euo pipefail
          test -n "$SPARKLE_ED25519_PRIVATE_KEY"
          test "$RELEASE_TAG" = dogfood-mac
          ARCHIVE="Kraki-${BUNDLE_BUILD}.app.zip"
          WORK_DIR="$RUNNER_TEMP/dogfood-appcast"
          mkdir -p "$WORK_DIR/archives" "$WORK_DIR/sparkle" "$WORK_DIR/out"
          cp "$RUNNER_TEMP/sparkle-update/$ARCHIVE" "$WORK_DIR/archives/$ARCHIVE"
          gh api "repos/${GITHUB_REPOSITORY}/contents/appcast.xml?ref=mac-updates" \
            -H 'Accept: application/vnd.github.raw' > "$WORK_DIR/production.xml"
          cp "$WORK_DIR/production.xml" "$WORK_DIR/archives/appcast.xml"
          gh release download 2.9.5 --repo sparkle-project/Sparkle \
            --pattern 'Sparkle-for-Swift-Package-Manager.zip' \
            --dir "$WORK_DIR"
          unzip -q "$WORK_DIR/Sparkle-for-Swift-Package-Manager.zip" -d "$WORK_DIR/sparkle"
          # --maximum-versions: DOGFOOD_FEED_ITEMS in dogfood-feed.mjs.
          "$WORK_DIR/sparkle/bin/generate_appcast" \
            --ed-key-file - \
            --download-url-prefix "https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/" \
            --full-release-notes-url "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}" \
            --link "https://kraki.chat" \
            --maximum-versions 2 \
            "$WORK_DIR/archives" <<< "$SPARKLE_ED25519_PRIVATE_KEY"
          FEED="$WORK_DIR/out/appcast-dogfood.xml"
          cp "$WORK_DIR/archives/appcast.xml" "$FEED"
          node scripts/release/dogfood-feed.mjs check "$FEED" "$WORK_DIR/production.xml" "$BUNDLE_BUILD" \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/${ARCHIVE}"
          cat "$FEED"

      - name: Upload dogfood Sparkle feed
        # Not a build-kraki-* artifact: the publish job adds the feed after
        # the manifest and attestation (see "Add the dogfood Sparkle feed").
        if: needs.prepare.outputs.publish_mode == 'prerelease'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dogfood-feed-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dogfood-appcast/out/appcast-dogfood.xml
          if-no-files-found: error

      - name: Verify packaged app
        run: |
          set -euo pipefail
          VERIFY_DIR="$RUNNER_TEMP/verify-package"
          mkdir -p "$VERIFY_DIR"
          tar -xzf "$RUNNER_TEMP/kraki-mac-gui-universal.app.tar.gz" -C "$VERIFY_DIR"
          APP="$VERIFY_DIR/Kraki.app"
          test -f "$APP/Contents/MacOS/Kraki"
          ARCHS=$(lipo -archs "$APP/Contents/MacOS/Kraki")
          grep -qw arm64 <<< "$ARCHS"
          grep -qw x86_64 <<< "$ARCHS"
          codesign --verify --strict --verbose=2 "$APP"
          # Built-in tentacle: universal helper, launch agent, version lock.
          HELPER="$APP/Contents/Library/Helpers/Kraki.app"
          test "$(lipo -archs "$HELPER/Contents/MacOS/kraki")" = "x86_64 arm64"
          plutil -lint "$APP/Contents/Library/LaunchAgents/chat.kraki.mac.tentacle.plist"
          SHIPPED=$(/usr/libexec/PlistBuddy -c "Print :KrakiTentacleVersion" "$APP/Contents/Info.plist")
          EXPECTED=$(node -p "require('./packages/tentacle/package.json').version")
          test "$SHIPPED" = "$EXPECTED"
          test "$("$HELPER/Contents/MacOS/kraki" --version)" = "$EXPECTED"
          if [ "${{ needs.prepare.outputs.publish_mode }}" != "dry-run" ] || [ "${{ github.event.inputs.notarize }}" = "true" ]; then
            bash scripts/release/apple-retry.sh xcrun stapler validate "$APP"
            spctl -a -vvv --type exec "$APP"
          fi
          PRERELEASE_VERSION='${{ needs.prepare.outputs.prerelease_version }}'
          if [ -n "$PRERELEASE_VERSION" ]; then
            test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist")" = "${PRERELEASE_VERSION%-dev.*}"
            test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Contents/Info.plist")" = '${{ needs.prepare.outputs.prerelease_bundle_build }}'
          fi

      - name: Upload .app bundle artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-kraki-mac-gui-universal-app-${{ github.run_attempt }}
          path: ${{ runner.temp }}/kraki-mac-gui-universal.app.tar.gz
          if-no-files-found: error

      - name: Build disk image
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          NOTARIZE: ${{ (needs.prepare.outputs.publish_mode == 'publish' || needs.prepare.outputs.publish_mode == 'prerelease' || github.event.inputs.notarize == 'true') && '1' || '0' }}
        run: |
          set -euo pipefail
          # The DMG is the download for new users: it opens on Kraki next to an
          # Applications alias, so the app is dragged into place in Finder.
          # Opening it from Downloads instead would run it translocated, and a
          # background service registered from there breaks at the next reboot.
          APP="$RUNNER_TEMP/KrakiMac.xcarchive/Products/Applications/Kraki.app"
          DMG="$RUNNER_TEMP/Kraki.dmg"
          python3 -m venv "$RUNNER_TEMP/dmgbuild-venv"
          "$RUNNER_TEMP/dmgbuild-venv/bin/pip" install --quiet "dmgbuild==1.6.7"
          export PATH="$RUNNER_TEMP/dmgbuild-venv/bin:$PATH"
          scripts/mac/build-dmg.sh "$APP" "$DMG"
          codesign --force --timestamp --sign "$APPLE_SIGNING_IDENTITY" "$DMG"
          if [ "$NOTARIZE" = "1" ]; then
            xcrun notarytool submit "$DMG" \
              --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" --wait
            bash scripts/release/apple-retry.sh xcrun stapler staple "$DMG"
            bash scripts/release/apple-retry.sh xcrun stapler validate "$DMG"
            spctl -a -vvv -t open --context context:primary-signature "$DMG"
          fi
          ls -lh "$DMG"

      - name: Upload disk image artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-kraki-mac-dmg-${{ github.run_attempt }}
          path: ${{ runner.temp }}/Kraki.dmg
          if-no-files-found: error

  # ─── Publish ────────────────────────────────────────────

  publish:
    name: Publish Release Assets
    needs:
      - prepare
      - build-binary
      - staple-macos-x64
      - build-mac-gui
    # Run for any non-head release where the relevant build succeeded (or was
    # correctly skipped). build-binary (and staple-macos-x64 with it) is
    # skipped for head-v*/mac-v*; build-mac-gui is skipped for v*/head-v*.
    # Neither may have failed.
    if: |
      always() &&
      needs.prepare.result == 'success' &&
      (needs.prepare.outputs.publish_mode == 'publish' || needs.prepare.outputs.publish_mode == 'prerelease') &&
      (
        (((github.event_name == 'push' && startsWith(github.ref_name, 'v') && !startsWith(github.ref_name, 'head-v')) ||
          (github.event_name == 'workflow_dispatch' &&
           ((github.event.inputs.mode == 'dry-run' && github.event.inputs.target == 'tentacle') ||
            (github.event.inputs.mode == 'prerelease' && github.event.inputs.target == 'tentacle') ||
            (startsWith(github.event.inputs.tag, 'v') && !startsWith(github.event.inputs.tag, 'head-v'))))) &&
         needs.build-binary.result == 'success' && needs.staple-macos-x64.result == 'success') ||
        (((github.event_name == 'push' && startsWith(github.ref_name, 'mac-v')) ||
          (github.event_name == 'workflow_dispatch' &&
           ((github.event.inputs.mode == 'dry-run' && github.event.inputs.target == 'mac') ||
            (github.event.inputs.mode == 'prerelease' && github.event.inputs.target == 'mac') ||
            startsWith(github.event.inputs.tag, 'mac-v')))) &&
         needs.build-mac-gui.result == 'success')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out release tooling
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: build-kraki-*-${{ github.run_attempt }}
          path: release-assets
          merge-multiple: true

      - name: Generate release manifest and checksums
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          PRERELEASE_VERSION: ${{ needs.prepare.outputs.prerelease_version }}
          PRERELEASE_BUNDLE_BUILD: ${{ needs.prepare.outputs.prerelease_bundle_build }}
        run: |
          set -euo pipefail
          if [ "$RELEASE_TAG" = dogfood-mac ]; then
            node scripts/release/artifacts.mjs manifest release-assets mac "$PRERELEASE_VERSION" "Kraki-${PRERELEASE_BUNDLE_BUILD}.app.zip"
            exit 0
          elif [ "$RELEASE_TAG" = dogfood-cli ]; then
            COMPONENT=cli; VERSION="$PRERELEASE_VERSION"
          elif [[ "$RELEASE_TAG" == mac-v* ]]; then
            COMPONENT=mac; VERSION="${RELEASE_TAG#mac-v}"
          else
            COMPONENT=cli; VERSION="${RELEASE_TAG#v}"
          fi
          node scripts/release/artifacts.mjs manifest release-assets "$COMPONENT" "$VERSION"

      - name: Attest build provenance
        id: provenance
        if: needs.prepare.outputs.publish_mode == 'publish' || needs.prepare.outputs.publish_mode == 'prerelease'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'release-assets/*'

      - name: Verify provenance before publication and preserve proof
        env:
          GH_TOKEN: ${{ github.token }}
          PROVENANCE_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          set -euo pipefail
          node scripts/release/artifacts.mjs verify release-assets "$PROVENANCE_BUNDLE"
          cp "$PROVENANCE_BUNDLE" release-assets/provenance.json

      - name: Add the dogfood Sparkle feed
        # Published with the dogfood-mac assets but outside the manifest and
        # attestation: the feed carries its own EdDSA signature (the app
        # requires signed feeds), and every formal Mac release replaces it
        # (publish-mac-appcast). prerelease.mjs publish swaps it in last.
        if: needs.prepare.outputs.publish_mode == 'prerelease' && needs.prepare.outputs.release_tag == 'dogfood-mac'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dogfood-feed-${{ github.run_attempt }}
          path: release-assets

      - name: Upload release assets bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets-${{ needs.prepare.outputs.release_sha }}-${{ github.run_attempt }}
          path: release-assets
          if-no-files-found: error

      - name: Create GitHub Release
        if: needs.prepare.outputs.publish_mode == 'publish'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: |
          # install.sh / install.ps1 and the README download links resolve the
          # CLI through GitHub's "latest" release. Only CLI tags (v*) may take
          # it; a Mac or head release marked latest breaks the one-line install.
          case "$RELEASE_TAG" in
            v*) latest=true ;;
            *) latest=false ;;
          esac
          NOTES=(--generate-notes)
          if [ -f "release-notes/$RELEASE_TAG.md" ]; then NOTES=(--notes-file "release-notes/$RELEASE_TAG.md"); fi
          gh release create "$RELEASE_TAG" \
            --repo "${{ github.repository }}" \
            --title "$RELEASE_TAG" \
            "${NOTES[@]}" \
            --latest="$latest" \
            release-assets/*

      - name: Replace dogfood release assets
        # Updates the rolling dogfood-cli / dogfood-mac prerelease in place
        # (docs/dogfood.md): new assets are uploaded under temporary names
        # and verified before they replace the previous set; then the tag
        # moves to this commit and the notes are rewritten. Never "latest".
        if: needs.prepare.outputs.publish_mode == 'prerelease'
        env:
          GH_TOKEN: ${{ github.token }}
          COMPONENT: ${{ github.event.inputs.target == 'mac' && 'mac' || 'cli' }}
          SHA: ${{ needs.prepare.outputs.release_sha }}
          VERSION: ${{ needs.prepare.outputs.prerelease_version }}
          BUNDLE_BUILD: ${{ needs.prepare.outputs.prerelease_bundle_build }}
          TENTACLE_VERSION: ${{ needs.prepare.outputs.prerelease_tentacle_version }}
          BASE: ${{ github.event.inputs.prerelease_base }}
        run: node scripts/release/prerelease.mjs publish

      - name: Undo an interrupted dogfood publish
        # A failed or cancelled run leaves the previous complete asset set
        # (or no release at all on a first build, never a draft).
        if: (failure() || cancelled()) && needs.prepare.outputs.publish_mode == 'prerelease'
        env:
          GH_TOKEN: ${{ github.token }}
          COMPONENT: ${{ github.event.inputs.target == 'mac' && 'mac' || 'cli' }}
        run: node scripts/release/prerelease.mjs recover

      - name: Verify downloaded release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: |
          set -euo pipefail
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir verify-release
          node scripts/release/artifacts.mjs verify verify-release verify-release/provenance.json

  # ─── Publish Sparkle appcast ───────────────────────────

  publish-mac-appcast:
    name: Publish macOS Sparkle Appcast
    needs:
      - prepare
      - publish
    if: |
      always() &&
      needs.prepare.result == 'success' &&
      needs.publish.result == 'success' &&
      needs.prepare.outputs.publish_mode == 'publish' &&
      startsWith(needs.prepare.outputs.release_tag, 'mac-v')
    runs-on: macos-26
    timeout-minutes: 15
    concurrency:
      group: mac-updates-appcast
      cancel-in-progress: false

    steps:
      - name: Check out appcast branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: mac-updates
          fetch-depth: 1

      - name: Generate and publish signed appcast
        env:
          GH_TOKEN: ${{ github.token }}
          SPARKLE_ED25519_PRIVATE_KEY: ${{ secrets.SPARKLE_ED25519_PRIVATE_KEY }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          test -n "$SPARKLE_ED25519_PRIVATE_KEY"

          WORK_DIR="$RUNNER_TEMP/sparkle-appcast"
          mkdir -p "$WORK_DIR/archives" "$WORK_DIR/sparkle"
          cp appcast.xml "$WORK_DIR/archives/appcast.xml"

          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'Kraki.app.zip' \
            --dir "$WORK_DIR/archives"
          test -f "$WORK_DIR/archives/Kraki.app.zip"

          # What the update window shows. People read it, so prefer notes
          # written for them: release-notes/<tag>.md in the tagged commit,
          # else the annotated tag's message, and only as a last resort
          # GitHub's generated list of pull request titles.
          NOTES="$WORK_DIR/archives/Kraki.app.md"
          if gh api "repos/$GITHUB_REPOSITORY/contents/release-notes/$RELEASE_TAG.md?ref=$RELEASE_TAG" \
               -H 'Accept: application/vnd.github.raw' > "$NOTES" 2>/dev/null && [ -s "$NOTES" ]; then
            echo "Release notes: release-notes/$RELEASE_TAG.md"
          else
            TAG_OBJECT=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq 'select(.object.type == "tag") | .object.sha' || true)
            if [ -n "$TAG_OBJECT" ] && gh api "repos/$GITHUB_REPOSITORY/git/tags/$TAG_OBJECT" --jq .message > "$NOTES" && [ -s "$NOTES" ]; then
              echo "Release notes: annotated tag message"
            else
              gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
                --json body --jq .body > "$NOTES"
            fi
          fi

          gh release download 2.9.5 --repo sparkle-project/Sparkle \
            --pattern 'Sparkle-for-Swift-Package-Manager.zip' \
            --dir "$RUNNER_TEMP"
          unzip -q "$RUNNER_TEMP/Sparkle-for-Swift-Package-Manager.zip" -d "$WORK_DIR/sparkle"
          GENERATE_APPCAST="$WORK_DIR/sparkle/bin/generate_appcast"

          "$GENERATE_APPCAST" \
            --ed-key-file - \
            --download-url-prefix "https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/" \
            --full-release-notes-url "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}" \
            --embed-release-notes \
            --link "https://kraki.chat" \
            --maximum-versions 3 \
            "$WORK_DIR/archives" <<< "$SPARKLE_ED25519_PRIVATE_KEY"

          test -f "$WORK_DIR/archives/appcast.xml"
          grep -q 'sparkle:edSignature=' "$WORK_DIR/archives/appcast.xml"
          grep -q 'Kraki.app.zip' "$WORK_DIR/archives/appcast.xml"
          VERIFY_DIR="$RUNNER_TEMP/sparkle-update-verify"
          mkdir -p "$VERIFY_DIR"
          unzip -q "$WORK_DIR/archives/Kraki.app.zip" -d "$VERIFY_DIR"
          UPDATE_BUILD_VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' \
            "$VERIFY_DIR/Kraki.app/Contents/Info.plist")
          test -n "$UPDATE_BUILD_VERSION"
          grep -q "sparkle:version>${UPDATE_BUILD_VERSION}<" "$WORK_DIR/archives/appcast.xml"
          cp "$WORK_DIR/archives/appcast.xml" appcast.xml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add appcast.xml
          git diff --cached --quiet && exit 0
          git commit -m "chore(mac): publish appcast for ${RELEASE_TAG}"
          git push origin mac-updates

      - name: Check out release tooling
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}
          path: tooling

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24

      - name: Refresh the dogfood Sparkle feed
        # A Mac on the Dogfood channel reads only appcast-dogfood.xml of the
        # dogfood-mac release (docs/dogfood.md). Add this release to it, so a
        # dogfood build below it is offered it. Runs after the production
        # appcast is pushed; the production appcast never gets dogfood items.
        id: refresh_dogfood_feed
        working-directory: tooling
        env:
          GH_TOKEN: ${{ github.token }}
          SPARKLE_ED25519_PRIVATE_KEY: ${{ secrets.SPARKLE_ED25519_PRIVATE_KEY }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          PRODUCTION_DIR="$RUNNER_TEMP/sparkle-appcast/archives"
          WORK_DIR="$RUNNER_TEMP/dogfood-appcast-refresh"
          mkdir -p "$WORK_DIR/archives"
          # Waits while a dogfood publish is swapping assets.
          node scripts/release/prerelease.mjs feed-fetch "$WORK_DIR/archives/appcast.xml"
          if [ ! -f "$WORK_DIR/archives/appcast.xml" ]; then
            echo "No dogfood feed to refresh."
            exit 0
          fi
          cp "$PRODUCTION_DIR/Kraki.app.zip" "$WORK_DIR/archives/"
          if [ -s "$PRODUCTION_DIR/Kraki.app.md" ]; then cp "$PRODUCTION_DIR/Kraki.app.md" "$WORK_DIR/archives/"; fi
          # --maximum-versions: DOGFOOD_FEED_ITEMS in dogfood-feed.mjs.
          "$RUNNER_TEMP/sparkle-appcast/sparkle/bin/generate_appcast" \
            --ed-key-file - \
            --download-url-prefix "https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/" \
            --full-release-notes-url "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}" \
            --embed-release-notes \
            --link "https://kraki.chat" \
            --maximum-versions 2 \
            "$WORK_DIR/archives" <<< "$SPARKLE_ED25519_PRIVATE_KEY"
          UPDATE_BUILD_VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' \
            "$RUNNER_TEMP/sparkle-update-verify/Kraki.app/Contents/Info.plist")
          node scripts/release/dogfood-feed.mjs check "$WORK_DIR/archives/appcast.xml" "$PRODUCTION_DIR/appcast.xml" \
            "$UPDATE_BUILD_VERSION" "https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/Kraki.app.zip"
          node scripts/release/prerelease.mjs feed-replace "$WORK_DIR/archives/appcast.xml"

      - name: Undo an interrupted dogfood feed refresh
        if: failure() && steps.refresh_dogfood_feed.outcome == 'failure'
        working-directory: tooling
        env:
          GH_TOKEN: ${{ github.token }}
          COMPONENT: mac
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/release/prerelease.mjs recover

  # ─── Publish npm packages ──────────────────────────────

  publish-npm:
    name: Publish npm Packages
    needs:
      - prepare
      - build-binary
      - staple-macos-x64
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: |
      always() &&
      needs.prepare.result == 'success' &&
      needs.prepare.outputs.publish_mode == 'publish' &&
      (
        (startsWith(needs.prepare.outputs.release_tag, 'head-v') && needs.build-binary.result == 'skipped')
        || (!startsWith(needs.prepare.outputs.release_tag, 'head-v') && needs.build-binary.result == 'success' && needs.staple-macos-x64.result == 'success')
      )
    permissions:
      contents: write
      id-token: write
    env:
      ARTIFACT_DIR: ${{ github.workspace }}/npm-artifacts

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}

      - name: Enable corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
          registry-url: https://registry.npmjs.org

      - name: Show npm version
        # Node 24 bundles a complete npm (with the `sigstore` dep) that supports
        # `npm publish --provenance`. We deliberately do NOT `npm i -g npm@latest`
        # here: npm's global self-upgrade has shipped broken trees missing its own
        # `sigstore`/`tuf-js` deps, which made `--provenance` crash with
        # "Cannot find module 'sigstore'". Use the bundled npm as-is.
        run: npm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm --filter @kraki/tentacle... --filter @kraki/head... build

      - name: Shared packages are not stale on npm
        # A changed protocol/crypto with an unchanged version would be skipped
        # below, and tentacle/head published against the old copy.
        run: node scripts/release/check-published.mjs packages/protocol packages/crypto packages/pulse

      - name: Pack and publish
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: |
          set -euo pipefail
          mkdir -p "$ARTIFACT_DIR"

          # Each tag publishes only its own component plus the shared packages
          # it depends on: a head-v* tag must not put an untested CLI on npm
          # "latest" (and a CLI tag must not ship an undeployed Head).
          specs=(
            "packages/protocol|@kraki/protocol"
            "packages/crypto|@kraki/crypto"
            "packages/pulse|@kraki/pulse"
          )
          case "$RELEASE_TAG" in
            head-v*) specs+=("packages/head|@kraki/head") ;;
            v*) specs+=("packages/tentacle|@kraki/tentacle") ;;
            *) echo "::error::publish-npm: unexpected tag $RELEASE_TAG"; exit 1 ;;
          esac

          for spec in "${specs[@]}"; do
            dir="${spec%%|*}"
            pkg="${spec##*|}"
            version="$(node -p "require('./${dir}/package.json').version")"

            if npm view "${pkg}@${version}" version >/dev/null 2>&1; then
              echo "Skipping ${pkg}@${version}; already published."
              continue
            fi

            echo "::group::Publishing ${pkg}@${version}"
            node scripts/release/build-info.mjs "$dir/dist/build-info.json" "$pkg" "$dir/package.json"
            pnpm --dir "$dir" pack --pack-destination "$ARTIFACT_DIR"
            tarball_name="$(node -p "const p = require('./${dir}/package.json'); p.name.replace(/^@/, '').replace('/', '-') + '-' + p.version + '.tgz'")"
            npm publish "$ARTIFACT_DIR/$tarball_name" --access public --provenance
            echo "::endgroup::"
          done
