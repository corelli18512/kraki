# TEMPORARY (POC branch only): region latency from GitHub-hosted runners.
name: POC region latency
on:
  push:
    branches: [poc/region-latency]
permissions:
  contents: read
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - run: corepack enable
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @kraki/tentacle...
      - run: pnpm --filter @kraki/protocol --filter @kraki/crypto build
      - name: Probe
        working-directory: packages/tentacle
        run: npx tsx scripts/region-latency-poc.ts --rounds 3
