name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Enable corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run validation
        run: pnpm validate

  test-ios:
    name: Test iOS (Kraki)
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: |
            packages/arm/ios/.build
            ~/Library/Developer/Xcode/DerivedData/*/SourcePackages
          key: ios-ci-spm-${{ hashFiles('packages/arm/ios/Kraki.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: ios-ci-spm-

      - name: Select iOS Simulator
        id: simulator
        run: |
          set -euo pipefail
          DEVICE_ID="$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          preferred = ("iPhone 17 Pro", "iPhone 16 Pro", "iPhone 16")
          devices = [d for runtime in data["devices"].values() for d in runtime if d.get("isAvailable")]
          for name in preferred:
              for device in devices:
                  if device.get("name") == name:
                      print(device["udid"])
                      raise SystemExit(0)
          raise SystemExit("No supported iPhone Simulator is available")
          ')"
          echo "id=$DEVICE_ID" >> "$GITHUB_OUTPUT"
          echo "Using Simulator $DEVICE_ID"

      - name: Build and test iOS
        run: |
          set -euo pipefail
          cd packages/arm/ios
          xcodebuild \
            -project Kraki.xcodeproj \
            -scheme Kraki \
            -configuration Debug \
            -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}' \
            -derivedDataPath build/DerivedData-iOS \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            test

      - name: Upload iOS test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-test-results
          path: packages/arm/ios/build/DerivedData-iOS/Logs/Test/*.xcresult
          if-no-files-found: ignore
          retention-days: 7

  build-mac-gui:
    name: Build macOS GUI (KrakiMac)
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Resolve Swift packages cache
        uses: actions/cache@v4
        with:
          path: |
            packages/arm/ios/.build
            ~/Library/Developer/Xcode/DerivedData/*/SourcePackages
          key: ${{ runner.os }}-spm-${{ hashFiles('packages/arm/ios/Kraki.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: ${{ runner.os }}-spm-

      - name: Build KrakiMac (Debug, no signing)
        run: |
          set -euo pipefail
          cd packages/arm/ios
          xcodebuild -project Kraki.xcodeproj -scheme KrakiMac \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            build

  binary-daemon-launch:
    name: Binary Daemon Launch (${{ matrix.label }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            label: Linux x64
          - runner: windows-2022
            label: Windows x64

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Enable corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install tentacle build dependencies
        run: pnpm install --frozen-lockfile --filter @kraki/tentacle...

      - name: Build tentacle SEA
        run: pnpm --filter @kraki/tentacle run build:binary:local

      - name: Exercise background daemon lifecycle
        shell: bash
        run: |
          set -euo pipefail
          case "${RUNNER_OS}" in
            Linux) binary="packages/tentacle/dist/sea/kraki-cli-linux-x64" ;;
            Windows) binary="packages/tentacle/dist/sea/kraki-cli-windows-x64.exe" ;;
            *) echo "unsupported runner: ${RUNNER_OS}"; exit 1 ;;
          esac
          node packages/tentacle/scripts/daemon-release-smoke.mjs "$binary"

  macos-daemon-launch:
    name: macOS Daemon Launch
    runs-on: macos-14
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Enable corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install tentacle build dependencies
        run: pnpm install --frozen-lockfile --filter @kraki/tentacle...

      - name: Prove Launch Services child identity inheritance and scrub
        run: node packages/tentacle/scripts/macos-launchservices-env-poc.mjs

      - name: Build tentacle SEA
        run: pnpm --filter @kraki/tentacle run build:binary:local

      - name: Create ad-hoc signed test app
        run: |
          set -euo pipefail
          BINARY="packages/tentacle/dist/sea/kraki-cli-macos-${RUNNER_ARCH}"
          if [ ! -f "$BINARY" ]; then
            BINARY="packages/tentacle/dist/sea/kraki-cli-macos-arm64"
          fi
          APP="packages/tentacle/dist/sea/Kraki.app"
          mkdir -p "$APP/Contents/MacOS"
          cp "$BINARY" "$APP/Contents/MacOS/kraki"
          cat > "$APP/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>CFBundleExecutable</key><string>kraki</string>
          <key>CFBundleIdentifier</key><string>chat.kraki.cli</string>
          <key>CFBundleName</key><string>Kraki</string>
          <key>CFBundlePackageType</key><string>APPL</string>
          <key>CFBundleVersion</key><string>ci</string>
          <key>LSBackgroundOnly</key><true/>
          </dict></plist>
          PLIST
          codesign --force --sign - "$APP/Contents/MacOS/kraki"
          codesign --force --sign - "$APP"
          codesign --verify --strict --verbose=2 "$APP"

      - name: Exercise launchd → open → ready → identity → stop
        run: node packages/tentacle/scripts/daemon-release-smoke.mjs packages/tentacle/dist/sea/Kraki.app/Contents/MacOS/kraki
