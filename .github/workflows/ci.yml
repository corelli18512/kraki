name: CI

on:
  # Full routine regression on demand; perf/device tests stay opt-in locally.
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    # Stable required check, also used by release.yml. Never hide a failed job.
    name: Validate
    needs: [scope, test-typescript, test-ios, build-mac-gui, test-network-resilience, binary-daemon-launch, macos-daemon-launch]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check selected results
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          assert results['scope']['result'] == 'success', results
          scope = results['scope']['outputs']
          groups = {'test-typescript': 'typescript', 'test-ios': 'native',
                    'build-mac-gui': 'native', 'test-network-resilience': 'resilience',
                    'binary-daemon-launch': 'binary',
                    'macos-daemon-launch': 'binary'}
          for job, group in groups.items():
              expected = 'success' if scope[group] == 'true' else 'skipped'
              assert results[job]['result'] == expected, (job, results[job]['result'], expected)
          PY

  scope:
    name: Select test scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      typescript: ${{ steps.scope.outputs.typescript }}
      native: ${{ steps.scope.outputs.native }}
      binary: ${{ steps.scope.outputs.binary }}
      resilience: ${{ steps.scope.outputs.resilience }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Test change routing
        run: node --test scripts/ci/test-scope.test.mjs
      - name: Select affected checks
        id: scope
        run: node scripts/ci/test-scope.mjs

  test-typescript:
    name: TypeScript regression
    needs: scope
    if: needs.scope.outputs.typescript == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Served installers match the repo installers
        # app.kraki.chat serves packages/arm/web/public/install.*; the copies
        # drifted once and the served macOS installer failed on clean Macs.
        run: |
          cmp install.sh packages/arm/web/public/install.sh
          cmp install.ps1 packages/arm/web/public/install.ps1

      - name: Enable corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run validation
        run: pnpm validate

  test-ios:
    name: Test iOS (Kraki)
    needs: scope
    if: needs.scope.outputs.native == 'true'
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: |
            packages/arm/ios/.build
            ~/Library/Developer/Xcode/DerivedData/*/SourcePackages
          key: ios-ci-spm-${{ hashFiles('packages/arm/ios/Kraki.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: ios-ci-spm-

      - name: Select iOS Simulator
        id: simulator
        run: |
          set -euo pipefail
          DEVICE_ID="$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          preferred = ("iPhone 17 Pro", "iPhone 16 Pro", "iPhone 16")
          devices = [d for runtime in data["devices"].values() for d in runtime if d.get("isAvailable")]
          for name in preferred:
              for device in devices:
                  if device.get("name") == name:
                      print(device["udid"])
                      raise SystemExit(0)
          raise SystemExit("No supported iPhone Simulator is available")
          ')"
          echo "id=$DEVICE_ID" >> "$GITHUB_OUTPUT"
          echo "Using Simulator $DEVICE_ID"

      - name: Build and test iOS
        run: |
          set -euo pipefail
          cd packages/arm/ios
          xcodebuild \
            -project Kraki.xcodeproj \
            -scheme Kraki \
            -configuration Debug \
            -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}' \
            -derivedDataPath build/DerivedData-iOS \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            KRAKI_RUN_UI_TESTS=1 \
            test

      - name: Upload iOS test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-test-results
          path: packages/arm/ios/build/DerivedData-iOS/Logs/Test/*.xcresult
          if-no-files-found: ignore
          retention-days: 7

  test-network-resilience:
    # Production Swift networking (Mac test host) against a local Head + real
    # Tentacle behind a fault-injection proxy. Fast subset here; the full
    # matrix and random chaos run nightly (network-resilience.yml).
    name: Network resilience (fast)
    needs: scope
    if: needs.scope.outputs.resilience == 'true'
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Enable corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          # Same runtime as the production Head. better-sqlite3 11.x (Head)
          # aborts in a GC finalizer on macOS with Node 24.20.
          node-version: '24.16.0'
          cache: pnpm

      - name: Install and build the local stack
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @kraki/protocol --filter @kraki/crypto --filter @kraki/head --filter @kraki/tentacle --filter @kraki/voice-broker build

      - name: Chaos stack smoke (protocol level)
        run: pnpm --filter @kraki/tests exec vitest run src/chaos/smoke.test.ts

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Network resilience scenarios
        run: |
          T=-only-testing:KrakiMacTests/NetworkResilienceTests
          bash scripts/chaos/run-native.sh $T/test_S0_healthyBaseline $T/test_A1_flashReset \
            $T/test_A2_outage15s $T/test_A3_halfOpen $T/test_B1_incidentProfile \
            $T/test_C2_resetRightAfterSend $T/test_C6_relaunchWithUnconfirmedInput \
            $T/test_D2_inboundDuringOutage $T/test_E1_headRestart $T/test_E2_tentacleOffline30s \
            $T/test_G1_largeDownlinkMessage $T/test_G2_largeUplinkMessage \
            $T/test_D3_backgroundThenForeground $T/test_D4_oneDeviceOfflineOtherUnaffected

      - name: Upload resilience evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: network-resilience-fast
          path: |
            /tmp/kraki-chaos/results
            /tmp/kraki-chaos/timeline.json
            /tmp/kraki-chaos/stack.log
            /tmp/kraki-chaos/xcode.log
          if-no-files-found: ignore
          retention-days: 14

  build-mac-gui:
    name: Build macOS GUI (KrakiMac)
    needs: scope
    if: needs.scope.outputs.native == 'true'
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Resolve Swift packages cache
        uses: actions/cache@v4
        with:
          path: |
            packages/arm/ios/.build
            ~/Library/Developer/Xcode/DerivedData/*/SourcePackages
          key: ${{ runner.os }}-spm-${{ hashFiles('packages/arm/ios/Kraki.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: ${{ runner.os }}-spm-

      - name: Test diagnostics recorder and off-band uploader (isolated)
        run: bash scripts/diag/run-native-tests.sh

      - name: Test event consumption and shared transport lifecycle
        run: bash scripts/diag/run-reliability-tests.sh

      - name: Enable corepack for loopback peer
        run: corepack enable

      - name: Set up loopback peer Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Test real WebSocket recovery against isolated peer
        run: |
          pnpm install --frozen-lockfile --ignore-scripts --filter @kraki/head...
          python3 scripts/diag/run-reliability-loopback.py

      - name: Test native voice audio safety
        run: swift test --package-path packages/arm/ios/Vendor/VoiceInputCore

      - name: Build KrakiMac (Debug, no signing)
        run: |
          set -euo pipefail
          cd packages/arm/ios
          xcodebuild -project Kraki.xcodeproj -scheme KrakiMac \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            build

  binary-daemon-launch:
    name: Binary Daemon Launch (${{ matrix.label }})
    needs: scope
    if: needs.scope.outputs.binary == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            label: Linux x64
          - runner: windows-2022
            label: Windows x64

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Enable corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install tentacle build dependencies
        run: pnpm install --frozen-lockfile --filter @kraki/tentacle...

      - name: Build tentacle SEA
        run: pnpm --filter @kraki/tentacle run build:binary:local

      - name: Test Windows installer release selection
        if: runner.os == 'Windows'
        shell: powershell
        run: ./scripts/e2e/windows-installer.test.ps1

      - name: Test Windows Codex command shims with spaces
        if: runner.os == 'Windows'
        run: node scripts/e2e/windows-codex-shim.mjs

      - name: Exercise background daemon lifecycle
        shell: bash
        run: |
          set -euo pipefail
          case "${RUNNER_OS}" in
            Linux) binary="packages/tentacle/dist/sea/kraki-cli-linux-x64" ;;
            Windows) binary="packages/tentacle/dist/sea/kraki-cli-windows-x64.exe" ;;
            *) echo "unsupported runner: ${RUNNER_OS}"; exit 1 ;;
          esac
          node packages/tentacle/scripts/daemon-release-smoke.mjs "$binary"

  macos-daemon-launch:
    name: macOS Daemon Launch
    needs: scope
    if: needs.scope.outputs.binary == 'true'
    runs-on: macos-14
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Enable corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install tentacle build dependencies
        run: pnpm install --frozen-lockfile --filter @kraki/tentacle...

      - name: Prove Launch Services child identity inheritance and scrub
        run: node packages/tentacle/scripts/macos-launchservices-env-poc.mjs

      - name: Build tentacle SEA
        run: pnpm --filter @kraki/tentacle run build:binary:local

      - name: Create ad-hoc signed test app
        run: |
          set -euo pipefail
          BINARY="packages/tentacle/dist/sea/kraki-cli-macos-${RUNNER_ARCH}"
          if [ ! -f "$BINARY" ]; then
            BINARY="packages/tentacle/dist/sea/kraki-cli-macos-arm64"
          fi
          APP="packages/tentacle/dist/sea/Kraki.app"
          mkdir -p "$APP/Contents/MacOS"
          cp "$BINARY" "$APP/Contents/MacOS/kraki"
          cat > "$APP/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>CFBundleExecutable</key><string>kraki</string>
          <key>CFBundleIdentifier</key><string>chat.kraki.cli</string>
          <key>CFBundleName</key><string>Kraki CLI</string>
          <key>CFBundlePackageType</key><string>APPL</string>
          <key>CFBundleVersion</key><string>ci</string>
          <key>LSBackgroundOnly</key><true/>
          </dict></plist>
          PLIST
          codesign --force --sign - "$APP/Contents/MacOS/kraki"
          codesign --force --sign - "$APP"
          codesign --verify --strict --verbose=2 "$APP"

      - name: Exercise launchd → open → ready → identity → stop
        run: node packages/tentacle/scripts/daemon-release-smoke.mjs packages/tentacle/dist/sea/Kraki.app/Contents/MacOS/kraki
