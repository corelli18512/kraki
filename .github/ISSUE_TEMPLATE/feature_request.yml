name: Feature request
description: Suggest something Kraki should do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The situation or problem, in your own words.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
  - type: dropdown
    id: app
    attributes:
      label: Which apps would it affect?
      multiple: true
      options: [Kraki for Mac, iPhone app, Kraki for Windows, Web app, Command-line (kraki CLI), Agents / integrations, Not sure]
